name: Premium preview effects

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/premium-preview-effects.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add premium preview effects
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          css='''
    /* Premium preview effects: presentation only, never baked into exports. */
    .stage-shell{perspective:1200px;transform-style:preserve-3d;--tilt-x:0deg;--tilt-y:0deg;--shine-x:50%;--shine-y:35%}
    .stage-shell canvas{transform:rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) translateZ(0);transform-origin:center;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease;will-change:transform,box-shadow}
    .stage-shell::after{content:"";position:absolute;inset:-2%;pointer-events:none;border-radius:28px;background:radial-gradient(circle at var(--shine-x) var(--shine-y),rgba(255,255,255,.20),rgba(255,255,255,.055) 18%,rgba(255,255,255,0) 46%);mix-blend-mode:screen;opacity:.68;filter:blur(.2px);transform:translateZ(24px);transition:opacity .22s ease}
    .stage-shell::before{content:"";position:absolute;inset:8% 6% -7%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.22),rgba(0,0,0,.07) 44%,transparent 72%);filter:blur(28px);transform:translateZ(-55px) scale(.96);pointer-events:none;opacity:.62;transition:opacity .22s ease,transform .22s ease}
    .stage-wrap{position:relative;isolation:isolate}
    .stage-wrap::before{content:"";position:absolute;width:min(72vw,760px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.72),rgba(255,255,255,.14) 42%,transparent 70%);filter:blur(40px);z-index:-1;pointer-events:none;opacity:.62}
    .stage-shell.preview-active canvas{box-shadow:0 34px 90px rgba(0,0,0,.18),0 10px 24px rgba(0,0,0,.10),0 0 0 1px rgba(255,255,255,.34)}
    .stage-shell.preview-active::before{opacity:.78;transform:translateZ(-58px) scale(1.03)}
    .stage-shell.preview-dragging canvas{transition:none}
    .stage-shell.preview-dragging::after{opacity:.82}
    .preview-badge{position:absolute;left:14px;top:14px;z-index:4;display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid rgba(255,255,255,.30);border-radius:999px;background:rgba(18,18,18,.46);color:#fff;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;backdrop-filter:blur(14px) saturate(1.25);box-shadow:0 7px 20px rgba(0,0,0,.12);pointer-events:none}
    .preview-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.72)}
    @media(max-width:900px){
      .stage-shell::after{opacity:.50}
      .stage-shell::before{filter:blur(22px);opacity:.52}
      .preview-badge{left:10px;top:10px;padding:6px 9px;font-size:9px}
    }
    @media(prefers-reduced-motion:reduce){
      .stage-shell canvas,.stage-shell::before,.stage-shell::after{transition:none!important;transform:none!important}
    }
'''
          if 'Premium preview effects: presentation only' not in s:
              s=s.replace('  </style>',css+'  </style>',1)

          old='''        <div class="stage-shell">\n          <canvas id="preview" width="900" height="900" aria-label="Jewel case artwork preview"></canvas>\n        </div>'''
          new='''        <div class="stage-shell" id="stageShell">\n          <div class="preview-badge">Live preview</div>\n          <canvas id="preview" width="900" height="900" aria-label="Jewel case artwork preview"></canvas>\n        </div>'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'id="stageShell"' not in s:
              raise SystemExit('stage shell block not found')

          anchor="  const ctx = canvas.getContext('2d');"
          js='''
  const stageShell = $('stageShell');
  const previewMotionOK = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function setPreviewTilt(clientX,clientY){
    if(!previewMotionOK || !stageShell)return;
    const r=stageShell.getBoundingClientRect();
    const nx=Math.max(0,Math.min(1,(clientX-r.left)/r.width));
    const ny=Math.max(0,Math.min(1,(clientY-r.top)/r.height));
    const tx=(.5-ny)*5.2,ty=(nx-.5)*6.4;
    stageShell.style.setProperty('--tilt-x',tx.toFixed(2)+'deg');
    stageShell.style.setProperty('--tilt-y',ty.toFixed(2)+'deg');
    stageShell.style.setProperty('--shine-x',(nx*100).toFixed(1)+'%');
    stageShell.style.setProperty('--shine-y',(ny*100).toFixed(1)+'%');
    stageShell.classList.add('preview-active');
  }
  function resetPreviewTilt(){
    if(!stageShell)return;
    stageShell.style.setProperty('--tilt-x','0deg');
    stageShell.style.setProperty('--tilt-y','0deg');
    stageShell.style.setProperty('--shine-x','50%');
    stageShell.style.setProperty('--shine-y','35%');
    stageShell.classList.remove('preview-active','preview-dragging');
  }
  if(stageShell){
    stageShell.addEventListener('pointermove',e=>setPreviewTilt(e.clientX,e.clientY));
    stageShell.addEventListener('pointerenter',e=>setPreviewTilt(e.clientX,e.clientY));
    stageShell.addEventListener('pointerleave',resetPreviewTilt);
    stageShell.addEventListener('pointerdown',()=>stageShell.classList.add('preview-dragging'));
    stageShell.addEventListener('pointerup',()=>stageShell.classList.remove('preview-dragging'));
    stageShell.addEventListener('pointercancel',()=>stageShell.classList.remove('preview-dragging'));
  }
'''
          if 'function setPreviewTilt' not in s:
              if anchor not in s: raise SystemExit('script anchor missing')
              s=s.replace(anchor,anchor+js,1)

          p.write_text(s)
          PY

      - name: Verify premium preview patch
        run: |
          grep -Fq 'Premium preview effects: presentation only' index.html
          grep -Fq 'function setPreviewTilt' index.html
          grep -Fq 'preview-badge' index.html

      - name: Remove one-shot workflow
        run: rm .github/workflows/premium-preview-effects.yml

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/premium-preview-effects.yml
          git commit -m 'Add premium live preview effects'
          git pull --rebase origin main
          git push origin main
