name: Apply reference jewel-case template

on:
  push:
    branches: [main]
    paths:
      - 'assets/reference-template.ready'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        run: python -m pip install --quiet pillow

      - name: Assemble reference image
        run: |
          cat assets/reference-template-550.b64.* | tr -d '\n\r ' | base64 --decode > assets/reference-template.jpg
          test -s assets/reference-template.jpg

      - name: Build template assets and recalibrate renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          src = Path('assets/reference-template.jpg')
          img = Image.open(src).convert('RGB')
          img.resize((3000, 3000), Image.Resampling.LANCZOS).save('assets/jewel-case-template-3000dpi.png', optimize=True)
          img.resize((1254, 1254), Image.Resampling.LANCZOS).save('assets/jewel-case-template.png', optimize=True)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(
              r'const cx=S\*\.?\d+,cy=S\*\.?\d+,r=S\*\.?\d+,hubR=S\*\.?\d+,hubProtectR=S\*\.?\d+;',
              'const cx=S*.5067,cy=S*.4981,r=S*.3852,hubR=S*.0710,hubProtectR=S*.0520;',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('Could not locate drawDisc geometry constants')
          s = re.sub(r'\n\s*// Redraw the small molded patent lettering as a true concentric arc\.\n\s*drawCenteredHubText\(c,S,cx,cy\);', '', s, count=1)
          s = re.sub(r'\n\s*// Add a realistic jewel-case spindle lock above the molded hub ring\.\n\s*drawCenterLockHub\(c,S,cx,cy\);', '', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify result
        run: |
          grep -F 'const cx=S*.5067,cy=S*.4981,r=S*.3852,hubR=S*.0710,hubProtectR=S*.0520;' index.html
          test -s assets/jewel-case-template-3000dpi.png
          test -s assets/jewel-case-template.png

      - name: Commit template update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/jewel-case-template-3000dpi.png assets/jewel-case-template.png assets/reference-template.jpg
          if git diff --cached --quiet; then
            echo 'No generated changes to commit'
            exit 0
          fi
          git commit -m 'Replace jewel case template and recalibrate disc alignment'
          git pull --rebase origin main
          git push origin HEAD:main
