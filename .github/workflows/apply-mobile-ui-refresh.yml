name: Apply mobile UI refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-ui-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject staged UI styles
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('index.html')
          css_file = Path('.github/mobile-ui-refresh.css')
          text = page.read_text()
          css = css_file.read_text()
          marker = '  </style>'
          if 'Mobile-first UI refresh: light, tactile, floating controls' not in text:
              if marker not in text:
                  raise SystemExit('style marker missing')
              text = text.replace(marker, '\n' + css + '\n' + marker, 1)
              page.write_text(text)
          PY

      - name: Verify patch
        run: grep -Fq 'Mobile-first UI refresh: light, tactile, floating controls' index.html

      - name: Clean staging files
        run: |
          rm -f .github/mobile-ui-refresh.css
          rm -f .github/workflows/apply-mobile-ui-refresh.yml

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/mobile-ui-refresh.css .github/workflows/apply-mobile-ui-refresh.yml
          git commit -m 'Apply mobile-first tactile UI refresh'
          git pull --rebase origin main
          git push origin main
