name: Audit and fix hub lettering

on:
  push:
    paths:
      - ".github/workflows/fix-hub-lettering.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-hub-lettering:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited hub lettering fix
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
      - name: Sanity check
        run: |
          grep -q "cleanOuter=S*.1330" index.html
          grep -q "textRadius=S*.1020" index.html
          grep -q "maxArc=Math.PI*.94" index.html
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit and fix center hub lettering"
          git push
