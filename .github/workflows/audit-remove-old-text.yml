name: Audit and remove old outer-ring text

on:
  push:
    paths:
      - ".github/workflows/audit-remove-old-text.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit and reconstruct text sector
        run: |
          python3 -m pip install --quiet opencv-python-headless pillow numpy
          echo '' | base64 -d > /tmp/clean.py
          python3 /tmp/clean.py
      - name: Verify
        run: |
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('assets/jewel-case-template-3000dpi.png')
          assert im.size==(3000,3000)
          print('dpi',im.info.get('dpi'))
          PY
          grep -Fq "function drawOuterRingText" index.html
      - name: Commit cleaned source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jewel-case-template-3000dpi.png index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fully remove baked-in outer-ring text"
          git push
