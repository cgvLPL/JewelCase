name: Refine realistic center lock hub

on:
  push:
    paths:
      - ".github/workflows/refine-center-lock-hub.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine jewel-case lock hub
        run: |
          echo '' | base64 -d > /tmp/refine_hub.py
          python3 /tmp/refine_hub.py
      - name: Verify
        run: |
          grep -Fq "const teeth=12;" index.html
          grep -Fq "const discHoleR=S*.0535;" index.html
          grep -Fq "Small center depression" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine realistic jewel-case center lock hub"
          git push
