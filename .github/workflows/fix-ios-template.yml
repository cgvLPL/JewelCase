name: Fix iOS jewel-case template

on:
  push:
    paths:
      - ".github/workflows/fix-ios-template.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good PNG template
        run: |
          git checkout e59c25b3d557c58907b2d0ffd4e1078404422dcf -- assets/jewel-case-template.png
          file assets/jewel-case-template.png
          test "$(wc -c < assets/jewel-case-template.png)" -gt 1000000

      - name: Point renderer to PNG
        run: |
          sed -i "s#assets/jewel-case-template.avif#assets/jewel-case-template.png#g" index.html
          grep -q "assets/jewel-case-template.png" index.html

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jewel-case-template.png index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore compatible jewel-case PNG template"
          git push
