name: Make disc realistic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/make-disc-realistic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upgrade disc renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker="""    c.restore();\n\n    if(state.grooves){\n"""
          insert="""    c.restore();\n\n    // Optical construction layers: a real CD reads as several concentric\n    // materials rather than one flat tinted circle. These layers are subtle,\n    // circular and scale with the export size, so they stay realistic without\n    // introducing synthetic oval highlights.\n    c.save();\n    c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.arc(cx,cy,hubProtectR,0,Math.PI*2,true);c.clip('evenodd');\n\n    // Dark molded edge / thickness at the outer circumference.\n    c.globalCompositeOperation='multiply';\n    const edgeShade=c.createRadialGradient(cx,cy,r*.86,cx,cy,r);\n    edgeShade.addColorStop(0,'rgba(0,0,0,0)');\n    edgeShade.addColorStop(.78,'rgba(0,0,0,.018)');\n    edgeShade.addColorStop(.94,'rgba(0,0,0,.14)');\n    edgeShade.addColorStop(1,'rgba(0,0,0,.34)');\n    c.fillStyle=edgeShade;c.fillRect(cx-r,cy-r,r*2,r*2);\n\n    // Thin silver reflective data band just inside the printable edge.\n    c.globalCompositeOperation='screen';\n    c.lineWidth=Math.max(1,S*.00115);\n    c.strokeStyle='rgba(222,232,238,.22)';\n    circlePath(c,cx,cy,r*.982);c.stroke();\n    c.lineWidth=Math.max(.7,S*.00062);\n    c.strokeStyle='rgba(255,255,255,.19)';\n    circlePath(c,cx,cy,r*.968);c.stroke();\n\n    // Real CDs have a faint radial metallic / polycarbonate falloff.\n    const optical=c.createRadialGradient(cx,cy,hubProtectR*1.02,cx,cy,r);\n    optical.addColorStop(0,'rgba(210,220,226,.055)');\n    optical.addColorStop(.18,'rgba(255,255,255,.018)');\n    optical.addColorStop(.72,'rgba(154,178,193,.025)');\n    optical.addColorStop(.93,'rgba(232,242,248,.06)');\n    optical.addColorStop(1,'rgba(255,255,255,.11)');\n    c.globalCompositeOperation='screen';\n    c.fillStyle=optical;c.fillRect(cx-r,cy-r,r*2,r*2);\n\n    // Inner clear polycarbonate ring around the molded spindle.\n    c.lineWidth=Math.max(1.2,S*.00135);\n    c.strokeStyle='rgba(220,230,236,.16)';\n    circlePath(c,cx,cy,hubProtectR*1.055);c.stroke();\n    c.lineWidth=Math.max(.7,S*.00058);\n    c.strokeStyle='rgba(255,255,255,.10)';\n    circlePath(c,cx,cy,hubProtectR*1.105);c.stroke();\n\n    // Extremely subtle circular light rolloff: only radial gradients, never\n    // ellipses, so the surface gains depth without a fake highlight artifact.\n    const lightRoll=c.createRadialGradient(cx-r*.22,cy-r*.18,r*.07,cx,cy,r*.96);\n    lightRoll.addColorStop(0,'rgba(255,255,255,.055)');\n    lightRoll.addColorStop(.42,'rgba(255,255,255,.018)');\n    lightRoll.addColorStop(1,'rgba(255,255,255,0)');\n    c.globalCompositeOperation='screen';\n    c.fillStyle=lightRoll;c.fillRect(cx-r,cy-r,r*2,r*2);\n    c.restore();\n\n    if(state.grooves){\n"""
          if marker not in s:
              raise SystemExit('disc insert marker not found')
          s=s.replace(marker,insert,1)
          old="""      c.lineWidth=Math.max(.65,S*.00045);\n      for(let rr=hubR*1.12;rr<r*.985;rr+=S*.0075){\n        c.strokeStyle=`rgba(255,255,255,${.009+(rr%19)/3600})`;\n        circlePath(c,cx,cy,rr);c.stroke();\n      }\n"""
          new="""      c.lineWidth=Math.max(.45,S*.00030);\n      // Dense, faint concentric tracks read more like a pressed optical disc\n      // than widely-spaced decorative rings.\n      let track=0;\n      for(let rr=hubR*1.18;rr<r*.974;rr+=S*.0046){\n        const a=.0065+(track%7)*.00115;\n        c.strokeStyle=`rgba(235,245,250,${a})`;\n        circlePath(c,cx,cy,rr);c.stroke();\n        track++;\n      }\n"""
          if old not in s:
              raise SystemExit('groove block marker not found')
          s=s.replace(old,new,1)
          old2="""      c.globalCompositeOperation='screen';\n      c.globalAlpha=.18+(state.glare/100)*.42;\n"""
          new2="""      c.globalCompositeOperation='screen';\n      // Keep photographed plastic/specular detail present but restrained so\n      // artwork remains printed-looking instead of washed out.\n      c.globalAlpha=.14+(state.glare/100)*.30;\n"""
          if old2 not in s:
              raise SystemExit('glare marker not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY

      - name: Verify realistic renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert 'Optical construction layers' in s
          assert 'Dense, faint concentric tracks' in s
          assert "c.globalAlpha=.14+(state.glare/100)*.30" in s
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/make-disc-realistic.yml

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/make-disc-realistic.yml
          git commit -m 'Make CD rendering more realistic'
          git pull --rebase origin main
          git push origin main
