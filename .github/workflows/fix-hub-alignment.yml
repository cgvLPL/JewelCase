name: Fix jewel-case hub alignment

on:
  push:
    paths:
      - ".github/workflows/fix-hub-alignment.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recalibrate disc and hub geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text()

          old = "const cx=S*.5010,cy=S*.4870,r=S*.4205,hubR=S*.1280;"
          new = "const cx=S*.5000,cy=S*.4960,r=S*.4270,hubR=S*.1290;"
          if old not in s:
              raise SystemExit("Expected disc geometry not found")
          s = s.replace(old, new, 1)

          s = s.replace(
              "// Geometry is calibrated to the supplied empty jewel-case photograph.",
              "// Geometry is calibrated to the supplied 1024px jewel-case photograph, centered on the photographed hub."
          )

          p.write_text(s)
          PY

      - name: Commit alignment fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix jewel-case center hub alignment"
          git push
