name: Add realistic center lock hub

on:
  push:
    paths:
      - ".github/workflows/add-center-lock-hub.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-center-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add jewel-case spindle lock
        run: |
          echo '' | base64 -d > /tmp/add_hub.py
          python3 /tmp/add_hub.py
      - name: Verify
        run: |
          grep -Fq "function drawCenterLockHub" index.html
          grep -Fq "const teeth=8;" index.html
          grep -Fq "drawCenterLockHub(c,S,cx,cy);" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add realistic jewel-case center lock hub"
          git push
