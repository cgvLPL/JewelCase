name: Fix CD outer ring text

on:
  push:
    paths:
      - ".github/workflows/fix-outer-ring-text.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-outer-ring-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch outer ring lettering
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
      - name: Verify patch
        run: |
          grep -Fq "function drawOuterRingText" index.html
          grep -Fq "MADE IN ENGLAND - OPTIMEDIA SOLUTIONS - POLYCARBONATE" index.html
          grep -Fq "drawOuterRingText(c,S,cx,cy,r);" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix CD outer ring manufacturing text"
          git push
