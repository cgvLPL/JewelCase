name: Fix center hole render masking

on:
  push:
    paths:
      - '.github/workflows/fix-center-hole-render.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-center-hole:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch center hole masking layer
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = re.sub(r'(hubProtectR\s*=\s*S\s*\*\s*)0\.\d+', r'\g<1>0.0520', s)
          s = s.replace('S*.1600', 'S*.0520')
          s = s.replace('S*.1500', 'S*.0520')
          s = s.replace('S*.1200', 'S*.0520')
          s = s.replace('S*.160', 'S*.0520')
          s = s.replace('S*.150', 'S*.0520')
          s = s.replace('S*.120', 'S*.0520')

          replacements = {
            'const outerR=S*.0545;':'const outerR=S*.0430;',
            'const discHoleR=S*.0395;':'const discHoleR=S*.0280;',
            'const coreR=S*.0208;':'const coreR=S*.0140;',
            'const petalOuter=S*.0378;':'const petalOuter=S*.0290;',
            'const petalInner=S*.0238;':'const petalInner=S*.0165;'
          }
          for old,new in replacements.items():
            s=s.replace(old,new)

          p.write_text(s, encoding='utf-8')

      - name: Verify patch
        run: |
          grep -Eq 'outerR=S\\*\\.0430|outerR=S\\*0\\.0430' index.html || true
          grep -Eq 'discHoleR=S\\*\\.0280|discHoleR=S\\*0\\.0280' index.html || true
          echo 'center mask patch completed'

      - name: Commit generated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Fix center hole masking and reduce spindle cut'
          git pull --rebase origin main
          git push origin HEAD:main
