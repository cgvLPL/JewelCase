name: Apply reference jewel-case template v2

on:
  push:
    paths:
      - '.github/template-reference-v2.b64'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-reference-template-v2
  cancel-in-progress: false

jobs:
  apply-template:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode supplied reference image
        shell: bash
        run: |
          base64 --decode .github/template-reference-v2.b64 > /tmp/jewel-case-reference.jpg

      - name: Install image conversion support
        run: python -m pip install --disable-pip-version-check pillow pillow-avif-plugin

      - name: Build template assets and recalibrate renderer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image
          import pillow_avif

          source = Path('/tmp/jewel-case-reference.jpg')
          assets = Path('assets')
          assets.mkdir(exist_ok=True)

          with Image.open(source) as src:
              src = src.convert('RGB')
              master = src.resize((3000, 3000), Image.Resampling.LANCZOS)
              master.save(assets / 'jewel-case-template-3000dpi.png', format='PNG', optimize=True)

              standard = src.resize((1254, 1254), Image.Resampling.LANCZOS)
              standard.save(assets / 'jewel-case-template.png', format='PNG', optimize=True)
              standard.save(assets / 'jewel-case-template.avif', format='AVIF', quality=88)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Geometry measured against the supplied square reference image.
          geometry = "const cx=S*.4925,cy=S*.4960,r=S*.3855,hubR=S*.0710,hubProtectR=S*.0500;"
          pattern = r"const\s+cx=S\*\.?\d+,cy=S\*\.?\d+,r=S\*\.?\d+,hubR=S\*\.?\d+,hubProtectR=S\*\.?\d+;"
          s, count = re.subn(pattern, geometry, s, count=1)
          if count != 1:
              raise SystemExit('Could not find drawDisc geometry declaration')

          # Keep the custom lock compact so it does not obscure the new photographed hub.
          replacements = {
              r"const outerR=S\*\.?\d+;": "const outerR=S*.0350;",
              r"const discHoleR=S\*\.?\d+;": "const discHoleR=S*.0210;",
              r"const coreR=S\*\.?\d+;": "const coreR=S*.0105;",
              r"const petalOuter=S\*\.?\d+;": "const petalOuter=S*.0220;",
              r"const petalInner=S\*\.?\d+;": "const petalInner=S*.0120;",
          }
          for pat, repl in replacements.items():
              s, n = re.subn(pat, repl, s, count=1)
              if n != 1:
                  raise SystemExit(f'Could not update spindle value: {pat}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify generated files
        shell: bash
        run: |
          test -s assets/jewel-case-template-3000dpi.png
          test -s assets/jewel-case-template.png
          test -s assets/jewel-case-template.avif
          grep -Fq 'const cx=S*.4925,cy=S*.4960,r=S*.3855,hubR=S*.0710,hubProtectR=S*.0500;' index.html

      - name: Commit and push template update
        shell: bash
        run: |
          rm -f .github/template-reference-v2.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Replace base template and recalibrate disc geometry [template applied]'
          git pull --rebase origin main
          git push origin HEAD:main
