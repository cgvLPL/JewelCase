name: Increase shrink-wrap realism

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/increase-shrink-wrap-effect.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply stronger shrink-wrap rendering
        run: python .github/scripts/increase_shrink_wrap_effect.py
      - name: Commit renderer update
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Increase shrink-wrap physical realism"
          git push
