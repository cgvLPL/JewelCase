name: Reduce center spindle cut

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reduce hub geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          changes={
            'const outerR=S*.0545;':'const outerR=S*.0485;',
            'const discHoleR=S*.0395;':'const discHoleR=S*.0345;',
            'const coreR=S*.0208;':'const coreR=S*.0185;',
            'const petalOuter=S*.0378;':'const petalOuter=S*.0328;',
            'const petalInner=S*.0238;':'const petalInner=S*.0208;',
            'const halfGap=.040;':'const halfGap=.036;',
            'const halfPetal=.094;':'const halfPetal=.086;',
            'circlePath(c,cx,cy,S*.0098);':'circlePath(c,cx,cy,S*.0088);'
          }
          for a,b in changes.items():
            if a in s:
              s=s.replace(a,b,1)
          p.write_text(s)
          PY

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Make center spindle cut less artwork" || exit 0
          git push
