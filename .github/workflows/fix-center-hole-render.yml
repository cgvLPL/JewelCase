name: Fix center hole render masking

on:
  push:
    paths:
      - '.github/workflows/fix-center-hole-render.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-center-hole:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch center hole masking layer
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Reduce any large center template restoration mask. The previous
          # spindle changes only affected the overlay, while this mask hid the
          # artwork underneath.
          s = re.sub(r'(hubProtectR\s*=\s*S\*\s*)\.\d+', r'\g<1>.0520', s)
          s = re.sub(r'(hubRadius\s*=\s*S\*\s*)\.\d+', r'\g<1>.0480', s)

          # If the renderer has a literal center clip, reduce it as well.
          s = s.replace('S*.1600', 'S*.0520')
          s = s.replace('S*.1500', 'S*.0520')
          s = s.replace('S*.1200', 'S*.0520')

          # Keep the visible mechanical hub smaller than the disc artwork.
          s = s.replace('const outerR=S*.0545;', 'const outerR=S*.0430;')
          s = s.replace('const discHoleR=S*.0395;', 'const discHoleR=S*.0280;')
          s = s.replace('const coreR=S*.0208;', 'const coreR=S*.0140;')
          s = s.replace('const petalOuter=S*.0378;', 'const petalOuter=S*.0290;')
          s = s.replace('const petalInner=S*.0238;', 'const petalInner=S*.0165;')

          p.write_text(s, encoding='utf-8')

      - name: Verify patch
        run: |
          grep -Fq 'const outerR=S*.0430;' index.html
          grep -Fq 'const discHoleR=S*.0280;' index.html

      - name: Commit generated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Fix center hole masking and reduce spindle cut'
          git push
