name: Refine full-size template and disc alignment

on:
  push:
    paths:
      - ".github/workflows/refine-template.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Build full-size template asset
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/jewel-case-template.png
          mkdir -p /tmp/jewelcase

          identify assets/jewel-case-template.png

          # Rebuild the stored template as a large export-ready source. The
          # repository currently contains a small rendition, so use high-quality
          # Lanczos resampling plus restrained sharpening instead of browser
          # interpolation at export time.
          convert assets/jewel-case-template.png             -filter Lanczos             -resize 2048x2048!             -unsharp 0x0.85+0.75+0.008             -define png:compression-level=9             /tmp/jewelcase/template-2048.png

          mv /tmp/jewelcase/template-2048.png assets/jewel-case-template.png
          identify assets/jewel-case-template.png

      - name: Tighten disc and hub alignment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()

          old = "const cx=S*.500,cy=S*.495,r=S*.409,hubR=S*.145;"
          new = "const cx=S*.5000,cy=S*.4960,r=S*.4125,hubR=S*.1415;"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("Disc geometry block is in an unexpected state")

          # Give the printed image a very small bleed under the photographed
          # outer disc edge so no dark seam appears after rotation/zoom.
          old2 = "drawCoverImage(c,S,cx,cy,r);"
          new2 = "drawCoverImage(c,S,cx,cy,r*1.015);"
          if old2 in s:
              s = s.replace(old2, new2, 1)
          elif new2 not in s:
              raise SystemExit("Disc artwork projection is in an unexpected state")

          p.write_text(s)
          PY

      - name: Commit refined renderer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jewel-case-template.png index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refine full-size template and disc alignment"
          git push
