name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply mobile-first UI and premium preview
        run: |
          cp .github/mobile-ui-refresh.css mobile-ui.css
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          mobile = '<link rel="stylesheet" href="mobile-ui.css?v=20260902">'
          premium = '<link rel="stylesheet" href="assets/premium-preview.css?v=20260903">'
          script = '<script src="assets/premium-preview.js?v=20260903" defer></script>'
          if mobile not in s:
              s = s.replace('</head>', '  ' + mobile + '\n</head>', 1)
          if premium not in s:
              s = s.replace('</head>', '  ' + premium + '\n</head>', 1)
          if script not in s:
              s = s.replace('</body>', '  ' + script + '\n</body>', 1)
          p.write_text(s)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
