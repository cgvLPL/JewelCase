name: Remove baked-in outer lettering

on:
  push:
    paths:
      - ".github/workflows/remove-baked-lettering.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-lettering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove lettering from source template
        run: |
          python3 -m pip install --quiet opencv-python-headless pillow numpy
          echo '' | base64 -d > /tmp/remove_lettering.py
          python3 /tmp/remove_lettering.py
      - name: Verify source edit
        run: |
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('assets/jewel-case-template-3000dpi.png')
          assert im.size == (3000,3000), im.size
          print('dpi:', im.info.get('dpi'))
          PY
          grep -Fq "function drawOuterRingText" index.html
          if grep -Fq "Remove the warped lettering baked into the source photograph." index.html; then
            echo "Runtime cover-up code still present" >&2
            exit 1
          fi
      - name: Commit cleaned template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jewel-case-template-3000dpi.png index.html
          git commit -m "Remove baked-in CD outer-ring lettering"
          git push
