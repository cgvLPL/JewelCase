name: Refine physical effects

on:
  push:
    branches: ["main"]
    paths:
      - '.github/refine-physical-effects.py'
      - '.github/workflows/refine-physical-effects.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Refine shrink wrap and cracks
        run: python .github/refine-physical-effects.py

      - name: Commit refined effects
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make shrink wrap and cracks more realistic" || exit 0
          git push
