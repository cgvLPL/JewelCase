name: Refine sticker position and realism

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-sticker-position-realism.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine sticker placement and material realism
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('  function drawBarcode(c,S){')
          end=s.index('\n  function render(target=canvas,size=900){', start)
          new=r'''  function stickerShadow(c,S,blur=.007,alpha=.24,dy=.004){
    c.shadowColor=`rgba(0,0,0,${alpha})`;
    c.shadowBlur=S*blur;
    c.shadowOffsetX=S*.0015;
    c.shadowOffsetY=S*dy;
  }

  function stickerPaperTexture(c,S,x,y,w,h,seedBase=0){
    c.save();
    c.globalCompositeOperation='multiply';
    for(let i=0;i<34;i++){
      const px=x+seeded(seedBase+i*3)*w;
      const py=y+seeded(seedBase+i*7+9)*h;
      const rr=S*(.00025+seeded(seedBase+i+33)*.00055);
      c.fillStyle=`rgba(70,55,42,${.018+seeded(seedBase+i+71)*.035})`;
      circlePath(c,px,py,rr);c.fill();
    }
    c.restore();
  }

  function drawBarcode(c,S){
    // Lower-right placement follows the flat lid area and stays off the disc.
    const x=S*.790,y=S*.845,w=S*.160,h=S*.076;
    c.save();
    c.translate(x+w/2,y+h/2);c.rotate(.010);
    stickerShadow(c,S,.006,.28,.0035);
    c.fillStyle='rgba(246,245,238,.975)';
    roundedRectPath(c,-w/2,-h/2,w,h,S*.003);c.fill();
    c.shadowColor='transparent';
    c.strokeStyle='rgba(70,64,54,.22)';c.lineWidth=Math.max(.65,S*.00055);
    roundedRectPath(c,-w/2,-h/2,w,h,S*.003);c.stroke();
    let cursor=-w*.38;
    for(let i=0;i<38;i++){
      const bw=(1+Math.floor(seeded(i+300)*3))*S*.00135;
      const bh=h*(.49+seeded(i+710)*.12);
      c.fillStyle=`rgba(12,12,12,${.91+seeded(i+900)*.08})`;
      c.fillRect(cursor,-h*.25,bw,bh);cursor+=bw+S*.00135;
      if(cursor>w*.39)break;
    }
    c.fillStyle='rgba(24,24,24,.88)';c.textAlign='left';
    c.font=`500 ${S*.0078}px ui-monospace,monospace`;
    c.fillText('3 25270 73250 6',-w*.38,h*.37);
    // Slightly lifted corner catches light like an adhesive label.
    const peel=c.createLinearGradient(w*.30,-h*.42,w*.45,-h*.26);
    peel.addColorStop(0,'rgba(255,255,255,.44)');peel.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=peel;c.beginPath();c.moveTo(w*.30,-h/2);c.lineTo(w/2,-h/2);c.lineTo(w/2,-h*.22);c.closePath();c.fill();
    c.restore();
    stickerPaperTexture(c,S,x,y,w,h,1200);
  }

  function drawAdvisory(c,S){
    // Sit above the barcode, aligned to the same right-hand lid region.
    const x=S*.786,y=S*.748,w=S*.152,h=S*.086;
    c.save();c.translate(x+w/2,y+h/2);c.rotate(-.006);
    stickerShadow(c,S,.0065,.30,.0035);
    c.fillStyle='rgba(244,244,238,.985)';c.fillRect(-w/2,-h/2,w,h);
    c.shadowColor='transparent';
    c.strokeStyle='rgba(8,8,8,.92)';c.lineWidth=S*.0032;c.strokeRect(-w/2,-h/2,w,h);
    c.fillStyle='#111';c.textAlign='center';
    c.font=`900 ${S*.0155}px Arial Black,Arial,sans-serif`;c.fillText('PARENTAL',0,-h*.16);
    c.fillRect(-w*.43,-h*.05,w*.86,h*.24);c.fillStyle='#fff';
    c.font=`900 ${S*.0125}px Arial Black,Arial,sans-serif`;c.fillText('ADVISORY',0,h*.13);
    c.fillStyle='#111';c.font=`800 ${S*.0095}px Arial,sans-serif`;c.fillText('EXPLICIT CONTENT',0,h*.38);
    c.globalAlpha=.16;c.fillStyle='#777';c.fillRect(-w*.45,-h*.44,w*.9,S*.0012);
    c.restore();
  }

  function drawPrice(c,S){
    // Retail price label sits higher on the right clear-plastic margin.
    const x=S*.815,y=S*.632,w=S*.120,h=S*.063;
    c.save();c.translate(x+w/2,y+h/2);c.rotate(-.045);
    stickerShadow(c,S,.007,.26,.004);
    const pg=c.createLinearGradient(-w/2,-h/2,w/2,h/2);
    pg.addColorStop(0,'rgba(236,155,174,.98)');pg.addColorStop(.55,'rgba(218,126,151,.97)');pg.addColorStop(1,'rgba(198,110,138,.97)');
    c.fillStyle=pg;roundedRectPath(c,-w/2,-h/2,w,h,S*.0032);c.fill();
    c.shadowColor='transparent';
    c.strokeStyle='rgba(95,46,59,.26)';c.lineWidth=Math.max(.7,S*.00065);roundedRectPath(c,-w/2,-h/2,w,h,S*.0032);c.stroke();
    c.fillStyle='rgba(57,30,36,.90)';c.textAlign='center';
    c.font=`700 ${S*.0097}px ui-monospace,monospace`;c.fillText('REDUCED TO',0,-h*.11);
    c.font=`800 ${S*.0215}px ui-monospace,monospace`;c.fillText('$9.99',0,h*.27);
    c.globalAlpha=.22;c.fillStyle='#fff';c.fillRect(-w*.40,-h*.40,w*.72,S*.0012);
    c.restore();
    stickerPaperTexture(c,S,x,y,w,h,2200);
  }

  function drawTitleSticker(c,S){
    const title=(state.albumTitle||'UNTITLED').toUpperCase(), artist=(state.artistName||'JEWELCASE').toUpperCase();
    // Long title strip follows the lower-left lid edge instead of crossing the CD.
    const x=S*.105,y=S*.866,w=S*.340,h=S*.064;
    c.save();c.translate(x+w/2,y+h/2);c.rotate(-.009);
    stickerShadow(c,S,.0075,.29,.0042);
    const tg=c.createLinearGradient(-w/2,0,w/2,0);
    tg.addColorStop(0,'rgba(239,142,107,.97)');tg.addColorStop(.54,'rgba(232,129,99,.98)');tg.addColorStop(1,'rgba(214,115,90,.97)');
    c.fillStyle=tg;roundedRectPath(c,-w/2,-h/2,w,h,S*.003);c.fill();
    c.shadowColor='transparent';
    c.strokeStyle='rgba(91,47,36,.19)';c.lineWidth=Math.max(.6,S*.00055);roundedRectPath(c,-w/2,-h/2,w,h,S*.003);c.stroke();
    c.fillStyle='rgba(32,20,17,.94)';c.textAlign='left';c.textBaseline='alphabetic';
    c.font=`900 ${S*.0215}px Impact,Arial Black,sans-serif`;
    c.fillText(title.slice(0,18),-w*.455,h*.075);
    c.font=`750 ${S*.0088}px system-ui`;c.fillStyle='rgba(43,25,21,.82)';
    c.fillText(artist.slice(0,22),-w*.455,h*.34);
    // Tiny registration line and adhesive shine improve printed-label realism.
    c.globalAlpha=.20;c.fillStyle='#fff';c.fillRect(-w*.455,-h*.39,w*.84,S*.0012);
    c.globalAlpha=.16;c.fillStyle='rgba(65,28,21,.7)';c.fillRect(w*.405,-h*.34,S*.0010,h*.68);
    c.restore();
    stickerPaperTexture(c,S,x,y,w,h,3200);
  }
'''
          s=s[:start]+new+s[end:]
          p.write_text(s)
          PY

      - name: Verify sticker realism patch
        run: |
          grep -Fq 'function stickerShadow' index.html
          grep -Fq 'function stickerPaperTexture' index.html
          grep -Fq 'const x=S*.790,y=S*.845,w=S*.160,h=S*.076;' index.html
          grep -Fq 'const x=S*.786,y=S*.748,w=S*.152,h=S*.086;' index.html
          grep -Fq 'const x=S*.815,y=S*.632,w=S*.120,h=S*.063;' index.html
          grep -Fq 'const x=S*.105,y=S*.866,w=S*.340,h=S*.064;' index.html

      - name: Remove one-shot workflow
        run: rm .github/workflows/refine-sticker-position-realism.yml

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/refine-sticker-position-realism.yml
          git commit -m 'Refine sticker position and realism'
          git pull --rebase origin main
          git push origin main
