name: Fix disc and case controls

on:
  push:
    paths:
      - '.github/workflows/fix-disc-case-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make disc finish and case selector visibly functional
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="""    // Optional color finish lives below the photographed specular layer.\n    const rgb=discColors[state.discStyle]||discColors.clear;\n    const alpha=(state.discOpacity/100)*(state.discStyle==='clear'?.32:1);\n    if(alpha>0){\n      c.save();\n      c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.arc(cx,cy,hubProtectR,0,Math.PI*2,true);c.clip('evenodd');\n      c.globalCompositeOperation=state.discStyle==='black'?'multiply':'soft-light';\n      c.fillStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})`;\n      c.fillRect(cx-r,cy-r,r*2,r*2);\n      if(state.discStyle==='iridescent'){\n        const rainbow=c.createLinearGradient(cx-r,cy-r,cx+r,cy+r);\n        rainbow.addColorStop(0,'rgba(255,70,150,.22)');\n        rainbow.addColorStop(.32,'rgba(80,120,255,.16)');\n        rainbow.addColorStop(.67,'rgba(80,255,205,.16)');\n        rainbow.addColorStop(1,'rgba(255,215,85,.18)');\n        c.fillStyle=rainbow;c.fillRect(cx-r,cy-r,r*2,r*2);\n      }\n      c.restore();\n    }\n"""

          new="""    // Disc finish is intentionally visible at normal slider values. The finish\n    // stays inside the printable disc area and never covers the photographed hub.\n    const rgb=discColors[state.discStyle]||discColors.clear;\n    const strength=Math.max(0,Math.min(1,state.discOpacity/75));\n    c.save();\n    c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.arc(cx,cy,hubProtectR,0,Math.PI*2,true);c.clip('evenodd');\n\n    if(state.discStyle==='clear'){\n      // Clear keeps the artwork neutral but adds a controllable glassy cool sheen.\n      if(strength>0){\n        const clearSheen=c.createRadialGradient(cx-r*.28,cy-r*.34,r*.06,cx,cy,r);\n        clearSheen.addColorStop(0,`rgba(238,248,255,${.10*strength})`);\n        clearSheen.addColorStop(.48,`rgba(155,190,215,${.055*strength})`);\n        clearSheen.addColorStop(1,'rgba(120,145,165,0)');\n        c.globalCompositeOperation='screen';\n        c.fillStyle=clearSheen;c.fillRect(cx-r,cy-r,r*2,r*2);\n      }\n    } else if(state.discStyle==='black'){\n      c.globalCompositeOperation='multiply';\n      c.fillStyle=`rgba(4,4,7,${.18+.62*strength})`;\n      c.fillRect(cx-r,cy-r,r*2,r*2);\n    } else if(state.discStyle==='smoke'){\n      c.globalCompositeOperation='multiply';\n      c.fillStyle=`rgba(24,27,34,${.12+.46*strength})`;\n      c.fillRect(cx-r,cy-r,r*2,r*2);\n      c.globalCompositeOperation='screen';\n      const smokeGlow=c.createLinearGradient(cx-r,cy-r,cx+r,cy+r);\n      smokeGlow.addColorStop(0,`rgba(135,145,160,${.06+.08*strength})`);\n      smokeGlow.addColorStop(1,'rgba(255,255,255,0)');\n      c.fillStyle=smokeGlow;c.fillRect(cx-r,cy-r,r*2,r*2);\n    } else if(state.discStyle==='iridescent'){\n      c.globalCompositeOperation='soft-light';\n      const rainbow=c.createLinearGradient(cx-r*.9,cy-r,cx+r*.9,cy+r);\n      rainbow.addColorStop(0,`rgba(255,74,157,${.18+.30*strength})`);\n      rainbow.addColorStop(.30,`rgba(87,124,255,${.16+.28*strength})`);\n      rainbow.addColorStop(.62,`rgba(73,255,207,${.15+.27*strength})`);\n      rainbow.addColorStop(1,`rgba(255,219,88,${.17+.28*strength})`);\n      c.fillStyle=rainbow;c.fillRect(cx-r,cy-r,r*2,r*2);\n      c.globalCompositeOperation='screen';\n      c.globalAlpha=.18+.28*strength;\n      c.fillStyle='rgba(255,255,255,.34)';\n      c.beginPath();c.ellipse(cx-r*.18,cy-r*.20,r*.72,r*.13,-.63,0,Math.PI*2);c.fill();\n    } else {\n      // Purple and pink get a saturated translucent lacquer rather than a\n      // barely-visible soft-light wash.\n      c.globalCompositeOperation='soft-light';\n      c.fillStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${.26+.50*strength})`;\n      c.fillRect(cx-r,cy-r,r*2,r*2);\n      c.globalCompositeOperation='screen';\n      c.globalAlpha=.10+.16*strength;\n      c.fillStyle=`rgba(${Math.min(255,rgb[0]+110)},${Math.min(255,rgb[1]+110)},${Math.min(255,rgb[2]+110)},.55)`;\n      c.beginPath();c.ellipse(cx-r*.20,cy-r*.24,r*.68,r*.12,-.58,0,Math.PI*2);c.fill();\n    }\n    c.restore();\n"""

          if old not in s:
              raise SystemExit('disc finish block not found')
          s=s.replace(old,new,1)

          old_case="""  function drawCase(c,S){\n    // The physical jewel case now comes from the supplied photographic template.\n    // These controls only add optional aging on top; they no longer redraw it.\n    if(state.caseStyle==='worn' && state.scratches){\n      c.save();c.lineCap='round';\n      const amount=Math.round(18+state.grain*.35);\n      for(let i=0;i<amount;i++){\n        const x=seeded(i+2)*S,y=seeded(i+55)*S,len=(.025+seeded(i+9)*.12)*S,ang=(-.9+seeded(i+91)*1.8);\n        c.strokeStyle=`rgba(255,255,255,${.025+seeded(i+7)*.07})`;\n        c.lineWidth=Math.max(.7,S*.00075);\n        c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(ang)*len,y+Math.sin(ang)*len);c.stroke();\n      }\n      c.restore();\n    } else if(state.caseStyle==='clean'){\n      c.save();\n      c.globalCompositeOperation='soft-light';\n      c.fillStyle='rgba(255,255,255,.045)';\n      c.fillRect(0,0,S,S);\n      c.restore();\n    }\n  }\n"""

          new_case="""  function drawCase(c,S){\n    if(state.caseStyle==='template')return;\n\n    // Case treatments are clipped OUTSIDE the disc, so changing the Case\n    // selector visibly changes the jewel-case plastic without recoloring the CD.\n    const cx=S*.5030,cy=S*.4980,discR=S*.4050;\n    c.save();\n    c.beginPath();\n    c.rect(0,0,S,S);\n    c.arc(cx,cy,discR,0,Math.PI*2,true);\n    c.clip('evenodd');\n\n    if(state.caseStyle==='clean'){\n      // Cleaner plastic: brighter acrylic, lower apparent grime, crisper rails.\n      if(templateImage.complete && templateImage.naturalWidth){\n        c.save();\n        c.filter='brightness(1.14) contrast(.90) saturate(.82)';\n        c.globalCompositeOperation='screen';\n        c.globalAlpha=.34;\n        c.drawImage(templateImage,0,0,S,S);\n        c.restore();\n      }\n      c.globalCompositeOperation='screen';\n      const polish=c.createLinearGradient(0,0,S,S);\n      polish.addColorStop(0,'rgba(255,255,255,.10)');\n      polish.addColorStop(.48,'rgba(210,225,235,.025)');\n      polish.addColorStop(1,'rgba(255,255,255,.075)');\n      c.fillStyle=polish;c.fillRect(0,0,S,S);\n    } else if(state.caseStyle==='worn'){\n      // Worn plastic: darker/yellower acrylic plus edge grime and scratches.\n      c.globalCompositeOperation='multiply';\n      c.fillStyle='rgba(71,62,48,.25)';\n      c.fillRect(0,0,S,S);\n      c.globalCompositeOperation='soft-light';\n      c.fillStyle='rgba(105,78,48,.20)';\n      c.fillRect(0,0,S,S);\n\n      if(state.scratches){\n        c.globalCompositeOperation='screen';\n        c.lineCap='round';\n        const amount=Math.round(34+state.grain*.65);\n        for(let i=0;i<amount;i++){\n          const x=seeded(i+2)*S,y=seeded(i+55)*S,len=(.018+seeded(i+9)*.15)*S,ang=(-1.05+seeded(i+91)*2.1);\n          c.strokeStyle=`rgba(255,255,255,${.035+seeded(i+7)*.11})`;\n          c.lineWidth=Math.max(.65,S*(.00045+seeded(i+13)*.00075));\n          c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(ang)*len,y+Math.sin(ang)*len);c.stroke();\n        }\n      }\n\n      c.globalCompositeOperation='multiply';\n      const edge=c.createRadialGradient(S*.5,S*.49,S*.34,S*.5,S*.49,S*.72);\n      edge.addColorStop(0,'rgba(0,0,0,0)');\n      edge.addColorStop(.72,'rgba(45,30,18,.05)');\n      edge.addColorStop(1,'rgba(32,20,11,.24)');\n      c.fillStyle=edge;c.fillRect(0,0,S,S);\n    }\n    c.restore();\n  }\n"""

          if old_case not in s:
              raise SystemExit('case block not found')
          s=s.replace(old_case,new_case,1)

          p.write_text(s)
          PY

      - name: Verify control implementation
        run: |
          grep -q "Disc finish is intentionally visible" index.html
          grep -q "Case treatments are clipped OUTSIDE the disc" index.html
          grep -q "state.caseStyle==='template'" index.html
          grep -q "state.discStyle==='iridescent'" index.html

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/fix-disc-case-controls.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-disc-case-controls.yml
          git commit -m 'Make disc finish and case controls functional'
          git pull --rebase origin main
          git push origin main
