name: Apply exact 1024 jewel-case template

on:
  push:
    paths:
      - '.github/apply-template-1024.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jewel-case-template-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify exact uploaded image
        shell: bash
        run: |
          cat .github/template-1024.b64.* | tr -d '\r\n ' | base64 --decode > /tmp/template-1024.jpg
          echo "09553f532721ea3aba37752325361adbbe62173e8f87002599d3ea24a04c3b44  /tmp/template-1024.jpg" | sha256sum -c -
          python -m pip install --disable-pip-version-check pillow >/dev/null
          python - <<'PY'
          from PIL import Image
          im = Image.open('/tmp/template-1024.jpg')
          assert im.format == 'JPEG', im.format
          assert im.size == (1024, 1024), im.size
          print('verified', im.format, im.size)
          PY

      - name: Install exact template and patch renderer
        shell: bash
        run: |
          cp /tmp/template-1024.jpg assets/jewel-case-template-1024.jpg
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          # Make the exact 1024x1024 upload the one and only active base template.
          s, n = re.subn(
              r"templateImage\.src\s*=\s*'[^']+';",
              "templateImage.src = 'assets/jewel-case-template-1024.jpg?v=09553f532721ea3a';",
              s,
              count=1,
          )
          assert n == 1, 'template source assignment not found'

          # Recalibrate artwork to this photographed case/disc.
          s, n = re.subn(
              r'const\s+cx=S\*\.?\d+,cy=S\*\.?\d+,r=S\*\.?\d+,hubR=S\*\.?\d+,hubProtectR=S\*\.?\d+;',
              'const cx=S*.5030,cy=S*.4980,r=S*.3890,hubR=S*.0900,hubProtectR=S*.0520;',
              s,
              count=1,
          )
          assert n == 1, 'disc geometry line not found'

          # Keep the template photo authoritative; synthetic case drawing is already aging-only.
          s = s.replace(
              '// Geometry is calibrated to the supplied jewel-case reference, centered on its photographed hub.',
              '// Geometry is calibrated to the exact 1024x1024 jewel-case template uploaded on 2026-09-02.'
          )

          p.write_text(s)
          PY

      - name: Remove stale template pipelines
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-reference-template-v2.yml \
            .github/workflows/apply-template-now.yml \
            .github/workflows/apply-template-reference.yml \
            .github/workflows/audit-template-candidates.yml \
            .github/workflows/fix-center-hole-render.yml \
            .github/workflows/fix-center-hole.yml \
            .github/workflows/reduce-center-cut.yml \
            .github/workflows/shrink-center-hole-again.yml \
            .github/workflows/test-canva-source.yml \
            .github/apply-template-now.trigger \
            .github/template-1024.b64.* \
            .github/apply-template-1024.trigger

      - name: Verify final repository state
        shell: bash
        run: |
          test "$(stat -c%s assets/jewel-case-template-1024.jpg)" = "187423"
          echo "09553f532721ea3aba37752325361adbbe62173e8f87002599d3ea24a04c3b44  assets/jewel-case-template-1024.jpg" | sha256sum -c -
          grep -Fq "templateImage.src = 'assets/jewel-case-template-1024.jpg?v=09553f532721ea3a';" index.html
          grep -Fq 'const cx=S*.5030,cy=S*.4980,r=S*.3890,hubR=S*.0900,hubProtectR=S*.0520;' index.html
          test ! -e .github/workflows/apply-template-now.yml
          test ! -e .github/workflows/fix-center-hole.yml

      - name: Commit exact 1024 template
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install exact 1024 jewel-case template'
          git pull --rebase origin main
          git push origin HEAD:main
