name: Apply jewel-case template now

on:
  push:
    paths:
      - '.github/workflows/apply-template-now.yml'
      - '.github/apply-template-now.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-template-now
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install AVIF support
        run: python -m pip install --disable-pip-version-check pillow pillow-avif-plugin

      - name: Normalize template assets and recalibrate geometry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image
          import pillow_avif

          source = Path('assets/jewel-case-template.png')
          if not source.exists():
              raise SystemExit('assets/jewel-case-template.png is missing')

          with Image.open(source) as im:
              im = im.convert('RGB')
              standard = im.resize((1254, 1254), Image.Resampling.LANCZOS)
              standard.save('assets/jewel-case-template.png', 'PNG', optimize=True)
              standard.save('assets/jewel-case-template.avif', 'AVIF', quality=88)
              master = im.resize((3000, 3000), Image.Resampling.LANCZOS)
              master.save('assets/jewel-case-template-3000dpi.png', 'PNG', optimize=True)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          geometry = 'const cx=S*.4925,cy=S*.4960,r=S*.3855,hubR=S*.0710,hubProtectR=S*.0500;'
          pattern = r'const\s+cx=S\*\.?\d+,cy=S\*\.?\d+,r=S\*\.?\d+,hubR=S\*\.?\d+,hubProtectR=S\*\.?\d+;'
          s, n = re.subn(pattern, geometry, s, count=1)
          if n != 1:
              raise SystemExit('drawDisc geometry declaration not found')

          values = [
              (r'const outerR=S\*\.?\d+;', 'const outerR=S*.0350;'),
              (r'const discHoleR=S\*\.?\d+;', 'const discHoleR=S*.0210;'),
              (r'const coreR=S\*\.?\d+;', 'const coreR=S*.0105;'),
              (r'const petalOuter=S\*\.?\d+;', 'const petalOuter=S*.0220;'),
              (r'const petalInner=S\*\.?\d+;', 'const petalInner=S*.0120;'),
          ]
          for pat, repl in values:
              s, n = re.subn(pat, repl, s, count=1)
              if n != 1:
                  raise SystemExit(f'center spindle value not found: {pat}')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        run: |
          test -s assets/jewel-case-template.png
          test -s assets/jewel-case-template-3000dpi.png
          test -s assets/jewel-case-template.avif
          grep -Fq 'const cx=S*.4925,cy=S*.4960,r=S*.3855,hubR=S*.0710,hubProtectR=S*.0500;' index.html

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/jewel-case-template.png assets/jewel-case-template-3000dpi.png assets/jewel-case-template.avif
          if git diff --cached --quiet; then
            echo 'No template changes required.'
            exit 0
          fi
          git commit -m 'Apply new jewel-case template and recalibrate disc geometry'
          git pull --rebase origin main
          git push origin HEAD:main
