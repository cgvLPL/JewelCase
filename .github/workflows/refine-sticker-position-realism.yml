name: Refine sticker position and realism

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-sticker-position-realism.yml'
      - '.github/scripts/refine_stickers.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply sticker refinement
        run: python .github/scripts/refine_stickers.py
      - name: Verify sticker refinement
        run: |
          grep -Fq 'function stickerShadow' index.html
          grep -Fq 'function stickerPaperTexture' index.html
          grep -Fq 'const x=S*.790,y=S*.845,w=S*.160,h=S*.076;' index.html
          grep -Fq 'const x=S*.786,y=S*.748,w=S*.152,h=S*.086;' index.html
          grep -Fq 'const x=S*.815,y=S*.632,w=S*.120,h=S*.063;' index.html
          grep -Fq 'const x=S*.105,y=S*.866,w=S*.340,h=S*.064;' index.html
      - name: Remove temporary migration files
        run: rm .github/workflows/refine-sticker-position-realism.yml .github/scripts/refine_stickers.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/refine-sticker-position-realism.yml .github/scripts/refine_stickers.py
          git commit -m 'Refine sticker position and realism'
          git pull --rebase origin main
          git push origin main
