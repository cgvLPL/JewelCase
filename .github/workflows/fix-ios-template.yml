name: Fix iOS jewel-case template

on:
  push:
    paths:
      - ".github/workflows/fix-ios-template.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Convert AVIF template to PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libheif-examples
          heif-convert assets/jewel-case-template.avif assets/jewel-case-template.png
          file assets/jewel-case-template.png
          test "$(wc -c < assets/jewel-case-template.png)" -gt 100000
      - name: Patch template loading
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jewel-case-template.png index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix iOS jewel-case template rendering"
          git push
