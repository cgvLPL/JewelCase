name: Upgrade physical realism

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-physical-realism.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply vintage retail and macro photography realism
        run: python .github/scripts/upgrade_physical_realism.py
      - name: Commit renderer upgrade
        run: |
          if git diff --quiet; then
            echo "No renderer changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade physical jewel case realism"
          git push
