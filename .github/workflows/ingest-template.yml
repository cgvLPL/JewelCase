name: Ingest supplied jewel-case template

on:
  push:
    paths:
      - ".github/workflows/ingest-template.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact supplied template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets /tmp/jewelcase

          Q='csig=AAAAAAAAAAAAAAAAAAAAAIVFOnMpiaE6hdawKroAXT9_amHciQACaM8Ar6KWlnmS&exp=1788207108&osig=AAAAAAAAAAAAAAAAAAAAAFeREV_Bz_XvPyxb7JXy8r3QuMn5dsCY2sP2VdDc3WZ-&signer=media-rpc&x-canva-quality=thumbnail'
          BASE='https://media.canva.com/v2/image-resize/format:PNG'
          URI='uri:ifs%3A%2F%2FM%2F8484330c-116e-4d40-92b8-36620e448a30'
          WM='watermark:F'

          urls=(
            "$BASE/height:736/quality:100/$URI/$WM/width:736?$Q"
            "$BASE/height:736/quality:100/$URI/$WM/width:736?csig=AAAAAAAAAAAAAAAAAAAAAIVFOnMpiaE6hdawKroAXT9_amHciQACaM8Ar6KWlnmS&exp=1788207108&osig=AAAAAAAAAAAAAAAAAAAAAFeREV_Bz_XvPyxb7JXy8r3QuMn5dsCY2sP2VdDc3WZ-&signer=media-rpc"
            "$BASE/height:200/quality:100/$URI/$WM/width:200?$Q"
          )

          best=""
          bestpx=0
          i=0
          for u in "${urls[@]}"; do
            i=$((i+1))
            f="/tmp/jewelcase/candidate-$i.png"
            echo "Trying candidate $i"
            if curl -fL --retry 2 --connect-timeout 15 --max-time 60 "$u" -o "$f"; then
              dims=$(python3 -c 'import struct,sys; d=open(sys.argv[1],"rb").read(24); print("%d %d"%struct.unpack(">II",d[16:24]) if len(d)>=24 and d[:8]==b"\x89PNG\r\n\x1a\n" else "0 0")' "$f")
              w=$(echo "$dims" | awk '{print $1}')
              h=$(echo "$dims" | awk '{print $2}')
              px=$((w*h))
              echo "candidate $i: ${w}x${h}"
              if [ "$px" -gt "$bestpx" ]; then
                best="$f"
                bestpx="$px"
              fi
            fi
          done

          if [ -z "$best" ] || [ "$bestpx" -eq 0 ]; then
            echo "No valid PNG template could be downloaded." >&2
            exit 1
          fi

          cp "$best" assets/jewel-case-template.png
          file assets/jewel-case-template.png

      - name: Commit template asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jewel-case-template.png
          git commit -m "Add supplied photorealistic jewel-case template"
          git push
