name: Match jewel case dimensions
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/match-jewel-case-dimensions.yml'
permissions:
  contents: write
jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply reference geometry
        run: python .github/scripts/match_jewel_case_dimensions.py
      - name: Commit calibrated dimensions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Match supplied jewel case proportions"
          git push
