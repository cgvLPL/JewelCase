name: Center hub patent text

on:
  push:
    paths:
      - ".github/workflows/center-hub-text.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  center-hub-text:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Center molded hub text
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Center molded hub patent text"
          git push
