name: Refine sticker layout

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/refine-sticker-layout.yml'
      - '.github/scripts/refine_stickers.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply sticker refinements
        run: python .github/scripts/refine_stickers.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Refine sticker placement and parental advisory"
          git push
