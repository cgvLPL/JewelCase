name: Add streaming cover sizes

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Apple Music and Spotify export presets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''          <option value="1080">1080 × 1080</option>\n          <option value="2048">2048 × 2048</option>\n          <option value="3000" selected>3000 × 3000</option>\n          <option value="4096">4096 × 4096</option>'''
          new='''          <option value="640">Spotify playlist · 640 × 640</option>\n          <option value="1080">Social square · 1080 × 1080</option>\n          <option value="2048">Hi-res square · 2048 × 2048</option>\n          <option value="3000" selected>Apple Music · 3000 × 3000</option>\n          <option value="4096">Ultra HD · 4096 × 4096</option>'''
          if old not in s:
              raise SystemExit('export size block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -Fq 'Spotify playlist · 640 × 640' index.html
          grep -Fq 'Apple Music · 3000 × 3000' index.html
      - name: Remove one-shot workflow
        run: rm .github/workflows/add-streaming-cover-sizes.yml
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/add-streaming-cover-sizes.yml
          git commit -m 'Add Apple Music and Spotify cover sizes'
          git pull --rebase origin main
          git push origin main
