name: Apply final supplied 1024 jewel-case template

on:
  push:
    paths:
      - '.github/apply-template-final-q70.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jewel-case-template-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify supplied 1024 image
        shell: bash
        run: |
          cat .github/exact1024-q70.b64.* | tr -d '\r\n ' | base64 --decode > /tmp/template-1024.webp
          test "$(stat -c%s /tmp/template-1024.webp)" = "66670"
          echo "9379d1d178b557064dedd82c9b46370d99df0a59a698347d4a8334d77d38957c  /tmp/template-1024.webp" | sha256sum -c -
          python -m pip install --disable-pip-version-check pillow >/dev/null
          python - <<'PY'
          from PIL import Image
          im = Image.open('/tmp/template-1024.webp')
          assert im.format == 'WEBP', im.format
          assert im.size == (1024, 1024), im.size
          print('verified', im.format, im.size)
          PY

      - name: Install template and patch renderer
        shell: bash
        run: |
          cp /tmp/template-1024.webp assets/jewel-case-template-1024.webp
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          s, n = re.subn(
              r"templateImage\.src\s*=\s*'[^']+';",
              "templateImage.src = 'assets/jewel-case-template-1024.webp?v=9379d1d178b55706';",
              s,
              count=1,
          )
          assert n == 1, 'template source assignment not found'

          s, n = re.subn(
              r'const\s+cx=S\*\.?\d+,cy=S\*\.?\d+,r=S\*\.?\d+,hubR=S\*\.?\d+,hubProtectR=S\*\.?\d+;',
              'const cx=S*.5030,cy=S*.4980,r=S*.3890,hubR=S*.0900,hubProtectR=S*.0520;',
              s,
              count=1,
          )
          assert n == 1, 'disc geometry line not found'
          p.write_text(s)
          PY

      - name: Remove old template assets and staging pipelines
        shell: bash
        run: |
          rm -f \
            assets/jewel-case-template-3000dpi.png \
            assets/jewel-case-template.png \
            assets/jewel-case-template.avif \
            assets/jewel-case-template-source.jpg \
            .github/template-1024.b64.* \
            .github/template1024.b64.00 \
            .github/template1024.webp.b64 \
            .github/exact1024-q70.b64.* \
            .github/apply-template-now.trigger \
            .github/apply-template-1024.trigger \
            .github/apply-template-1024-webp.trigger \
            .github/apply-template-final-q70.trigger
          find .github/workflows -maxdepth 1 -type f ! -name pages.yml -delete

      - name: Verify final repository state
        shell: bash
        run: |
          test "$(stat -c%s assets/jewel-case-template-1024.webp)" = "66670"
          echo "9379d1d178b557064dedd82c9b46370d99df0a59a698347d4a8334d77d38957c  assets/jewel-case-template-1024.webp" | sha256sum -c -
          grep -Fq "templateImage.src = 'assets/jewel-case-template-1024.webp?v=9379d1d178b55706';" index.html
          grep -Fq 'const cx=S*.5030,cy=S*.4980,r=S*.3890,hubR=S*.0900,hubProtectR=S*.0520;' index.html
          test ! -e assets/jewel-case-template-3000dpi.png
          test ! -e assets/jewel-case-template.png
          test ! -e assets/jewel-case-template.avif
          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n')" = "pages.yml"

      - name: Commit final template
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install final supplied 1024 jewel-case template'
          git pull --rebase origin main
          git push origin HEAD:main
