name: Revert jewel case sizing

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/revert-jewel-case-sizing.yml'
      - '.github/scripts/revert_jewel_case_sizing.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore previous jewel case sizing
        run: python .github/scripts/revert_jewel_case_sizing.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Revert jewel case sizing"
          git push
