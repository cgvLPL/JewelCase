name: Import high-res jewel-case template

on:
  push:
    paths:
      - ".github/workflows/refine-template.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Fetch high-resolution template from public Canva transfer design
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jewelcase assets

          VIEW_URL='https://www.canva.com/d/RUhj26YzeoBg98m'
          curl -fL --retry 3 --connect-timeout 20 --max-time 120 \
            -A 'Mozilla/5.0' "$VIEW_URL" -o /tmp/jewelcase/page.html

          python3 - <<'PY' > /tmp/jewelcase/candidates.txt
          from html.parser import HTMLParser
          from html import unescape
          import re

          html = open('/tmp/jewelcase/page.html', encoding='utf-8', errors='ignore').read()

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls=[]
              def handle_starttag(self, tag, attrs):
                  if tag != 'meta': return
                  d=dict(attrs)
                  key=d.get('property') or d.get('name')
                  if key in ('og:image','og:image:secure_url','twitter:image','twitter:image:src') and d.get('content'):
                      self.urls.append(unescape(d['content']))
          p=P(); p.feed(html)

          # Canva sometimes embeds signed preview URLs in JSON rather than meta tags.
          patterns = [
              r'https:\\/\\/[^"\\ ]+(?:document-export|media)\\.canva\\.com[^"\\ ]+',
              r'https://[^"<> ]+(?:document-export|media)\.canva\.com[^"<> ]+'
          ]
          urls=list(p.urls)
          for pat in patterns:
              for u in re.findall(pat, html):
                  u=u.replace('\\/','/')
                  urls.append(unescape(u))

          seen=set()
          for u in urls:
              if u.startswith('https://') and u not in seen:
                  seen.add(u)
                  print(u)
          PY

          echo "Found $(wc -l < /tmp/jewelcase/candidates.txt) candidate preview URLs"

          best=''
          bestpx=0
          i=0
          while IFS= read -r u; do
            [ -n "$u" ] || continue
            i=$((i+1))
            f="/tmp/jewelcase/candidate-$i"
            echo "Trying preview candidate $i"
            if curl -fL --retry 2 --connect-timeout 20 --max-time 120 \
                -A 'Mozilla/5.0' "$u" -o "$f"; then
              if identify "$f" >/dev/null 2>&1; then
                w="$(identify -format '%w' "$f")"
                h="$(identify -format '%h' "$f")"
                px=$((w*h))
                echo "candidate $i: ${w}x${h}"
                if [ "$px" -gt "$bestpx" ]; then
                  best="$f"
                  bestpx="$px"
                fi
              fi
            fi
          done < /tmp/jewelcase/candidates.txt

          if [ -z "$best" ]; then
            echo "No downloadable Canva preview image was found." >&2
            exit 1
          fi

          w="$(identify -format '%w' "$best")"
          h="$(identify -format '%h' "$best")"
          echo "Selected Canva transfer render: ${w}x${h}"

          # Never replace the template with a small thumbnail.
          if [ "$w" -lt 1000 ] || [ "$h" -lt 1000 ]; then
            echo "Best transferable render is only ${w}x${h}; refusing downgrade." >&2
            exit 1
          fi

          convert "$best" -resize 2048x2048! -colorspace sRGB \
            -define png:compression-level=9 assets/jewel-case-template.png
          identify assets/jewel-case-template.png

      - name: Calibrate disc alignment to new 2048 template
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          variants=[
              'const cx=S*.5000,cy=S*.4960,r=S*.4125,hubR=S*.1415;',
              'const cx=S*.500,cy=S*.495,r=S*.409,hubR=S*.145;',
              'const cx=S*.5000,cy=S*.5020,r=S*.4090,hubR=S*.1465;'
          ]
          new='const cx=S*.5000,cy=S*.5020,r=S*.4090,hubR=S*.1465;'
          for old in variants:
              if old in s:
                  s=s.replace(old,new,1)
                  break
          if new not in s:
              raise SystemExit('Disc geometry block not found')
          if 'drawCoverImage(c,S,cx,cy,r*1.015);' not in s:
              if 'drawCoverImage(c,S,cx,cy,r);' in s:
                  s=s.replace('drawCoverImage(c,S,cx,cy,r);','drawCoverImage(c,S,cx,cy,r*1.015);',1)
              else:
                  raise SystemExit('Artwork projection block not found')
          p.write_text(s)
          PY

      - name: Commit high-resolution base template
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jewel-case-template.png index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Use supplied high-res jewel-case base template"
          git push
