name: Apply exact 1024 jewel-case template

on:
  push:
    paths:
      - '.github/apply-template-1024-webp.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jewel-case-template-migration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify supplied 1024 image
        shell: bash
        run: |
          tr -d '\r\n ' < .github/template1024.webp.b64 | base64 --decode > /tmp/template-1024.webp
          echo "7d6bd5cf395ca5c2a2aa021e2b57b7b9f0eab1dabb2b3f61f4fad3e108cee648  /tmp/template-1024.webp" | sha256sum -c -
          python -m pip install --disable-pip-version-check pillow >/dev/null
          python - <<'PY'
          from PIL import Image
          im = Image.open('/tmp/template-1024.webp')
          assert im.format == 'WEBP', im.format
          assert im.size == (1024, 1024), im.size
          print('verified', im.format, im.size)
          PY

      - name: Install supplied template and patch renderer
        shell: bash
        run: |
          cp /tmp/template-1024.webp assets/jewel-case-template-1024.webp
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          s, n = re.subn(
              r"templateImage\.src\s*=\s*'[^']+';",
              "templateImage.src = 'assets/jewel-case-template-1024.webp?v=7d6bd5cf395ca5c2';",
              s,
              count=1,
          )
          assert n == 1, 'template source assignment not found'

          s, n = re.subn(
              r'const\s+cx=S\*\.?\d+,cy=S\*\.?\d+,r=S\*\.?\d+,hubR=S\*\.?\d+,hubProtectR=S\*\.?\d+;',
              'const cx=S*.5030,cy=S*.4980,r=S*.3890,hubR=S*.0900,hubProtectR=S*.0520;',
              s,
              count=1,
          )
          assert n == 1, 'disc geometry line not found'

          s = s.replace(
              '// Geometry is calibrated to the supplied jewel-case reference, centered on its photographed hub.',
              '// Geometry is calibrated to the 1024x1024 jewel-case image supplied on 2026-09-02.'
          )
          s = s.replace(
              '// Geometry is calibrated to the exact 1024x1024 jewel-case template uploaded on 2026-09-02.',
              '// Geometry is calibrated to the 1024x1024 jewel-case image supplied on 2026-09-02.'
          )
          p.write_text(s)
          PY

      - name: Remove stale template assets and staging files
        shell: bash
        run: |
          rm -f \
            assets/jewel-case-template-source.jpg \
            .github/template1024.b64.00 \
            .github/template1024.webp.b64 \
            .github/apply-template-1024-webp.trigger \
            .github/workflows/apply-exact-1024-template.yml

      - name: Verify final repository state
        shell: bash
        run: |
          test "$(stat -c%s assets/jewel-case-template-1024.webp)" = "137962"
          echo "7d6bd5cf395ca5c2a2aa021e2b57b7b9f0eab1dabb2b3f61f4fad3e108cee648  assets/jewel-case-template-1024.webp" | sha256sum -c -
          grep -Fq "templateImage.src = 'assets/jewel-case-template-1024.webp?v=7d6bd5cf395ca5c2';" index.html
          grep -Fq 'const cx=S*.5030,cy=S*.4980,r=S*.3890,hubR=S*.0900,hubProtectR=S*.0520;' index.html

      - name: Commit supplied 1024 template
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install supplied 1024 jewel-case template'
          git pull --rebase origin main
          git push origin HEAD:main
