name: Reduce center spindle cut

on:
  push:
    paths:
      - ".github/workflows/reduce-center-spindle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reduce-spindle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reduce center spindle geometry
        run: |
          echo '' | base64 -d > /tmp/reduce_spindle.py
          python3 /tmp/reduce_spindle.py

      - name: Verify geometry
        run: |
          grep -Fq "const outerR=S*.0545;" index.html
          grep -Fq "const discHoleR=S*.0395;" index.html
          grep -Fq "const coreR=S*.0208;" index.html
          grep -Fq "const petalOuter=S*.0378;" index.html
          grep -Fq "const petalInner=S*.0238;" index.html

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Make center spindle cut smaller"
          git push
