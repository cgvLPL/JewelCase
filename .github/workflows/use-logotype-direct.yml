name: Use logotype directly

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/use-logotype-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch header logo source
        run: python .github/scripts/use_logotype_direct.py
      - name: Commit header update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use new JewelCase logotype directly"
          git push
