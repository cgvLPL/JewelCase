name: Add packaging effects

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-packaging-effects.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply packaging effects
        run: python .github/scripts/add-packaging-effects.py

      - name: Verify effects
        run: |
          grep -Fq 'id="sealed"' index.html
          grep -Fq 'id="glitter"' index.html
          grep -Fq 'id="cracks"' index.html
          grep -Fq 'function drawSealedWrap' index.html
          grep -Fq 'function drawGlitter' index.html
          grep -Fq 'function drawCracks' index.html

      - name: Remove one-shot patch files
        run: |
          rm .github/scripts/add-packaging-effects.py
          rm .github/workflows/add-packaging-effects.yml

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/scripts/add-packaging-effects.py .github/workflows/add-packaging-effects.yml
          git commit -m 'Add sealed glitter and crack effects'
          git pull --rebase origin main
          git push origin main
