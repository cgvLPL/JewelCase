name: Audit staged template candidates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-template-candidates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image hash tools
        run: python -m pip install --disable-pip-version-check pillow imagehash
      - name: Inspect and recover candidate base64 sets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          import imagehash, base64, glob, io, itertools, hashlib

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          target = imagehash.hex_to_hash('eaea9797589431b1')
          patterns = [
              'assets/reference-template-550.b64.*',
              'assets/reference-template-mini.b64.*',
              'assets/reference-template-good.b64.*',
              'assets/reference-template.b64.*',
          ]

          def inspect(label, raw):
              raw = ''.join(raw.split())
              raw += '=' * ((4-len(raw)%4)%4)
              try:
                  data = base64.b64decode(raw, validate=False)
              except Exception as e:
                  print(label, 'B64FAIL', repr(e)); return
              starts=[i for i in range(len(data)-1) if data[i:i+2] == b'\xff\xd8']
              ends=[i for i in range(len(data)-1) if data[i:i+2] == b'\xff\xd9']
              print(label, 'decoded=',len(data),'sha=',hashlib.sha256(data).hexdigest(),'prefix=',data[:12].hex(),'SOI=',starts[:8],'EOI=',ends[-8:])
              candidates=[data]
              for st in starts[:8]:
                  for en in ends[-8:]:
                      if en > st:
                          candidates.append(data[st:en+2])
              seen=set()
              for cand in candidates:
                  h=hashlib.sha256(cand).hexdigest()
                  if h in seen: continue
                  seen.add(h)
                  try:
                      im=Image.open(io.BytesIO(cand)).convert('RGB')
                      ph=imagehash.phash(im)
                      print('  IMAGE','size=',im.size,'bytes=',len(cand),'phash=',ph,'distance=',ph-target,'sha=',h)
                  except Exception:
                      pass

          for pattern in patterns:
              files=sorted(glob.glob(pattern))
              if not files: continue
              parts=[Path(f).read_text() for f in files]
              print('SET',pattern,'parts=',len(parts),[len(''.join(p.split())) for p in parts])
              inspect(pattern+' normal', ''.join(parts))
              if len(parts) <= 5 and len(parts) > 1:
                  for perm in itertools.permutations(range(len(parts))):
                      if perm == tuple(range(len(parts))): continue
                      inspect(pattern+' perm='+''.join(map(str,perm)), ''.join(parts[i] for i in perm))
          PY
