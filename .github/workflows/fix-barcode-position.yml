name: Fix barcode position

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/fix-barcode-position.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply barcode geometry fix
        run: python .github/scripts/fix_barcode_position.py
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix barcode sticker placement"
          git push
# trigger
