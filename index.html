<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#09090b" />
  <meta name="description" content="Turn any photo into Y2K jewel-case CD artwork in your browser." />
  <title>JewelCase — Photo to CD Artwork</title>
  <style>
    :root{
      --bg:#09090b;--panel:#111114;--panel2:#17171b;--line:#2a2a30;--muted:#93939f;
      --text:#f4f4f5;--accent:#b9ff4a;--accent2:#7c5cff;--danger:#ff6b6b;
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{
      background:
        radial-gradient(circle at 15% 0%,rgba(124,92,255,.16),transparent 28rem),
        radial-gradient(circle at 95% 20%,rgba(185,255,74,.07),transparent 26rem),
        #09090b;
    }
    button,input,select{font:inherit}
    button{color:inherit}
    .app{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 360px}
    .workspace{min-width:0;display:flex;flex-direction:column}
    header{
      height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;
      border-bottom:1px solid rgba(255,255,255,.08);background:rgba(9,9,11,.72);backdrop-filter:blur(18px);
      position:sticky;top:0;z-index:10
    }
    .brand{display:flex;align-items:center;min-width:0}
    .brand-logo{
      display:block;width:250px;max-width:34vw;height:auto;max-height:54px;object-fit:contain;object-position:left center;
      filter:drop-shadow(0 2px 8px rgba(124,92,255,.18));
    }
    .top-actions{display:flex;gap:8px}
    .btn{
      border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:9px 12px;font-weight:700;font-size:13px;
      cursor:pointer;transition:.18s transform,.18s border-color,.18s background
    }
    .btn:hover{transform:translateY(-1px);border-color:#4a4a53}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#10130b}
    .stage-wrap{flex:1;display:grid;place-items:center;padding:32px;overflow:auto}
    .stage-shell{width:min(78vh,820px);max-width:100%;position:relative}
    .stage-shell:before{content:"";display:block;padding-top:100%}
    canvas{
      position:absolute;inset:0;width:100%;height:100%;display:block;background:#050506;border-radius:6px;
      box-shadow:0 28px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.05);
      touch-action:none;cursor:grab
    }
    canvas.dragging{cursor:grabbing}
    .hint{margin-top:12px;text-align:center;color:var(--muted);font-size:12px}
    aside{
      border-left:1px solid rgba(255,255,255,.08);background:rgba(15,15,18,.88);backdrop-filter:blur(18px);
      height:100vh;position:sticky;top:0;overflow:auto
    }
    .side-head{padding:20px;border-bottom:1px solid var(--line)}
    .side-head h1{margin:0 0 5px;font-size:18px;letter-spacing:-.03em}
    .side-head p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
    .section{padding:17px 18px;border-bottom:1px solid var(--line)}
    .section-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.13em;color:#b8b8c2;margin:0 0 13px}
    .upload{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      width:100%;min-height:118px;border:1px dashed #45454f;border-radius:14px;
      padding:18px 16px;text-align:center;background:#0d0d10;cursor:pointer;
      transition:.18s border-color,.18s background;overflow:hidden;
      -webkit-tap-highlight-color:transparent
    }
    .upload:hover,.upload.over{border-color:var(--accent);background:#11140d}
    .upload strong,.upload span{display:block;width:100%;text-align:center}
    .upload strong{font-size:13px;line-height:1.35;margin:0 0 6px}
    .upload span{font-size:11px;line-height:1.45;color:var(--muted);white-space:normal;overflow-wrap:anywhere}
    .upload input{display:none}
    .presets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .preset{
      padding:10px;border:1px solid var(--line);border-radius:12px;background:#121216;text-align:left;cursor:pointer;
      font-size:12px;font-weight:750
    }
    .preset span{display:block;color:var(--muted);font-size:10px;font-weight:600;margin-top:2px}
    .control{margin:12px 0}
    .control:first-child{margin-top:0}
    .control-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:12px}
    .value{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}
    input[type="range"]{width:100%;accent-color:var(--accent)}
    select,.text-input{
      width:100%;background:#101013;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 10px;outline:none;font-size:12px
    }
    select:focus,.text-input:focus{border-color:#5d5d6a}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;margin:10px 0}
    .switch{position:relative;width:38px;height:22px;flex:0 0 auto}
    .switch input{opacity:0;width:0;height:0}
    .slider{position:absolute;inset:0;border-radius:999px;background:#33343a;cursor:pointer;transition:.2s}
    .slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:white;transition:.2s}
    .switch input:checked+.slider{background:var(--accent)}
    .switch input:checked+.slider:before{transform:translateX(16px);background:#111}
    .footer-actions{padding:18px;display:grid;gap:8px}
    .export-row{display:grid;grid-template-columns:1fr auto;gap:8px}
    .kbd{border:1px solid #3c3c44;border-bottom-color:#29292f;background:#18181c;border-radius:5px;padding:2px 5px;font-size:10px;color:#bfc0c7}
    .toast{position:fixed;left:24px;bottom:24px;padding:10px 13px;border-radius:10px;background:#f4f4f5;color:#111;font-weight:700;font-size:12px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:50}
    .toast.show{opacity:1;transform:none}
    @media(max-width:900px){
      .app{grid-template-columns:1fr}
      aside{position:relative;height:auto;border-left:0;border-top:1px solid var(--line);overflow:visible}
      .stage-wrap{padding:20px 14px}
      header{padding:0 14px}
      .stage-shell{width:min(92vw,760px)}
      .section{padding:16px 14px}
      .upload{min-height:124px;padding:20px 14px}
      .presets{gap:10px;margin-top:12px}
      .preset{min-width:0}
      .footer-actions{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
      .brand-logo{width:180px;max-width:38vw;max-height:46px}
      .top-actions{gap:6px}
      .top-actions .btn{padding:8px 10px;font-size:12px}
    }
    @media(max-width:520px){
      header{height:66px;padding:0 10px;gap:8px}
      .brand-logo{width:145px;max-width:40vw;max-height:42px}
      .top-actions .btn{padding:7px 8px;font-size:11px}
    }
  </style>
</head>
<body>
<div class="app">
  <main class="workspace">
    <header>
      <div class="brand">
        <img class="brand-logo" src="assets/jewelcase-logo-transparent.png" alt="JewelCase - Photo to Jewel Case Artwork">
      </div>
      <div class="top-actions">
        <button class="btn" id="resetBtn" type="button">Reset</button>
        <button class="btn primary" id="quickExportBtn" type="button">Export PNG</button>
      </div>
    </header>

    <div class="stage-wrap">
      <div>
        <div class="stage-shell">
          <canvas id="preview" width="900" height="900" aria-label="Jewel case artwork preview"></canvas>
        </div>
        <div class="hint">Drag the artwork to reposition · scroll to zoom · double-click to reset position</div>
      </div>
    </div>
  </main>

  <aside>
    <div class="side-head">
      <h1>Artwork controls</h1>
      <p>Everything runs locally in your browser. Your photo is never uploaded.</p>
    </div>

    <section class="section">
      <div class="section-title">Source</div>
      <label class="upload" id="dropZone">
        <input type="file" id="fileInput" accept="image/*" />
        <strong>Drop a photo here</strong>
        <span>or click to browse JPG, PNG, WEBP</span>
      </label>
      <div class="presets">
        <button class="preset" data-preset="night">Night Drive<span>purple + motion</span></button>
        <button class="preset" data-preset="clear">Clear Disc<span>clean + glossy</span></button>
        <button class="preset" data-preset="smoke">Smoke<span>dark + grainy</span></button>
        <button class="preset" data-preset="bubblegum">Bubblegum<span>pink + glossy</span></button>
      </div>
    </section>

    <section class="section">
      <div class="section-title">Photo</div>
      <div class="control">
        <div class="control-head"><label for="zoom">Zoom</label><span class="value" id="zoomVal"></span></div>
        <input id="zoom" type="range" min="0.6" max="2.8" value="1.05" step="0.01">
      </div>
      <div class="control">
        <div class="control-head"><label for="rotation">Rotation</label><span class="value" id="rotationVal"></span></div>
        <input id="rotation" type="range" min="-30" max="30" value="0" step="1">
      </div>
      <div class="control">
        <div class="control-head"><label for="brightness">Brightness</label><span class="value" id="brightnessVal"></span></div>
        <input id="brightness" type="range" min="55" max="145" value="100" step="1">
      </div>
      <div class="control">
        <div class="control-head"><label for="contrast">Contrast</label><span class="value" id="contrastVal"></span></div>
        <input id="contrast" type="range" min="70" max="160" value="108" step="1">
      </div>
      <div class="control">
        <div class="control-head"><label for="saturation">Saturation</label><span class="value" id="saturationVal"></span></div>
        <input id="saturation" type="range" min="0" max="180" value="100" step="1">
      </div>
      <div class="control">
        <div class="control-head"><label for="motion">Spin blur</label><span class="value" id="motionVal"></span></div>
        <input id="motion" type="range" min="0" max="18" value="2" step="1">
      </div>
    </section>

    <section class="section">
      <div class="section-title">Disc</div>
      <div class="grid2">
        <div>
          <label class="control-head" for="discStyle">Finish</label>
          <select id="discStyle">
            <option value="purple">Purple tint</option>
            <option value="clear" selected>Clear</option>
            <option value="smoke">Smoke</option>
            <option value="black">Black</option>
            <option value="pink">Pink tint</option>
            <option value="iridescent">Iridescent</option>
          </select>
        </div>
        <div>
          <label class="control-head" for="caseStyle">Case</label>
          <select id="caseStyle">
            <option value="template">Supplied template</option>
            <option value="worn">Extra worn</option>
            <option value="clean">Cleaner finish</option>
          </select>
        </div>
      </div>
      <div class="control">
        <div class="control-head"><label for="discOpacity">Disc tint</label><span class="value" id="discOpacityVal"></span></div>
        <input id="discOpacity" type="range" min="0" max="75" value="10" step="1">
      </div>
      <div class="control">
        <div class="control-head"><label for="glare">Glare</label><span class="value" id="glareVal"></span></div>
        <input id="glare" type="range" min="0" max="100" value="48" step="1">
      </div>
      <div class="control">
        <div class="control-head"><label for="grain">Grain / dust</label><span class="value" id="grainVal"></span></div>
        <input id="grain" type="range" min="0" max="100" value="12" step="1">
      </div>
      <div class="toggle-row"><span>Disc grooves</span><label class="switch"><input id="grooves" type="checkbox" checked><span class="slider"></span></label></div>
      <div class="toggle-row"><span>Plastic scratches</span><label class="switch"><input id="scratches" type="checkbox" checked><span class="slider"></span></label></div>
    </section>

    <section class="section">
      <div class="section-title">Labels</div>
      <div class="grid2">
        <input class="text-input" id="albumTitle" maxlength="26" placeholder="Album title">
        <input class="text-input" id="artistName" maxlength="24" placeholder="Artist">
      </div>
      <div class="toggle-row"><span>Title sticker</span><label class="switch"><input id="titleSticker" type="checkbox"><span class="slider"></span></label></div>
      <div class="toggle-row"><span>Parental advisory</span><label class="switch"><input id="advisory" type="checkbox"><span class="slider"></span></label></div>
      <div class="toggle-row"><span>Price sticker</span><label class="switch"><input id="priceSticker" type="checkbox"><span class="slider"></span></label></div>
      <div class="toggle-row"><span>Barcode</span><label class="switch"><input id="barcode" type="checkbox"><span class="slider"></span></label></div>
    </section>

    <div class="footer-actions">
      <div class="export-row">
        <select id="exportSize" aria-label="Export size">
          <option value="1080">1080 × 1080</option>
          <option value="2048">2048 × 2048</option>
          <option value="3000" selected>3000 × 3000</option>
          <option value="4096">4096 × 4096</option>
        </select>
        <select id="exportType" aria-label="Export format">
          <option value="png">PNG</option>
          <option value="jpeg">JPG</option>
        </select>
      </div>
      <button class="btn primary" id="exportBtn" type="button">Download artwork</button>
    </div>
  </aside>
</div>
<div class="toast" id="toast">Exported</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('preview');
  const ctx = canvas.getContext('2d');
  const templateImage = new Image();
  templateImage.decoding = 'async';
  templateImage.src = 'assets/jewel-case-template-1024.webp?v=9379d1d178b55706';
  templateImage.onload = () => requestRender();
  const state = {
    image:null, zoom:1.05, rotation:0, brightness:100, contrast:108, saturation:100, motion:2,
    discStyle:'clear', caseStyle:'template', discOpacity:10, glare:48, grain:12,
    grooves:true, scratches:true, titleSticker:false, advisory:false, priceSticker:false, barcode:false,
    albumTitle:'', artistName:'', x:0, y:0
  };

  const controls = [
    'zoom','rotation','brightness','contrast','saturation','motion','discStyle','caseStyle','discOpacity','glare','grain',
    'grooves','scratches','titleSticker','advisory','priceSticker','barcode','albumTitle','artistName'
  ];

  function syncState(){
    controls.forEach(id=>{
      const el=$(id);
      state[id]=el.type==='checkbox' ? el.checked : (el.type==='range' ? Number(el.value) : el.value);
    });
    $('zoomVal').textContent=state.zoom.toFixed(2)+'×';
    $('rotationVal').textContent=state.rotation+'°';
    $('brightnessVal').textContent=state.brightness+'%';
    $('contrastVal').textContent=state.contrast+'%';
    $('saturationVal').textContent=state.saturation+'%';
    $('motionVal').textContent=state.motion;
    $('discOpacityVal').textContent=state.discOpacity+'%';
    $('glareVal').textContent=state.glare+'%';
    $('grainVal').textContent=state.grain+'%';
  }

  controls.forEach(id=>{
    $(id).addEventListener('input',()=>{syncState(); requestRender();});
    $(id).addEventListener('change',()=>{syncState(); requestRender();});
  });

  const discColors = {
    purple:[52,35,105], clear:[165,178,190], smoke:[18,19,25], black:[4,4,7], pink:[133,56,112], iridescent:[40,70,90]
  };

  function roundedRectPath(c,x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
  }

  function circlePath(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.closePath();}

  function drawCenteredHubText(c,S,cx,cy){
    const text='US PAT. 12/234567 - CAN PAT. 1234567 - EURO PAT. 1234567';
    const cleanOuter=S*.1330;
    const cleanInner=S*.0600;
    const textRadius=S*.1020;

    c.save();
    c.beginPath();
    c.arc(cx,cy,cleanOuter,0,Math.PI*2);
    c.arc(cx,cy,cleanInner,0,Math.PI*2,true);
    c.clip('evenodd');
    const hubBg=c.createRadialGradient(cx,cy,cleanInner,cx,cy,cleanOuter);
    hubBg.addColorStop(0,'#050506');
    hubBg.addColorStop(.68,'#09090b');
    hubBg.addColorStop(1,'#040405');
    c.fillStyle=hubBg;
    c.fillRect(cx-cleanOuter,cy-cleanOuter,cleanOuter*2,cleanOuter*2);
    c.restore();

    c.save();
    c.lineWidth=Math.max(1,S*.00115);
    c.strokeStyle='rgba(235,240,245,.16)';
    circlePath(c,cx,cy,S*.1280); c.stroke();
    c.strokeStyle='rgba(255,255,255,.08)';
    circlePath(c,cx,cy,S*.0730); c.stroke();
    c.restore();

    c.save();
    c.fillStyle='rgba(232,232,228,.76)';
    c.textAlign='center';
    c.textBaseline='middle';

    let fontPx=S*.00735;
    const minFont=S*.00635;
    const tracking=S*.00018;
    const maxArc=Math.PI*.94;

    function setFont(){
      c.font=`500 ${fontPx}px Arial, Helvetica, sans-serif`;
    }
    function measureArc(){
      let total=0;
      for(const ch of text) total+=c.measureText(ch).width+tracking;
      return Math.max(0,total-tracking)/textRadius;
    }

    setFont();
    let arc=measureArc();
    while(arc>maxArc && fontPx>minFont){
      fontPx*=.985;
      setFont();
      arc=measureArc();
    }

    const naturalArc=arc;
    const arcScale=naturalArc>maxArc ? maxArc/naturalArc : 1;
    const usedArc=naturalArc*arcScale;
    let angle=-Math.PI/2-usedArc/2;

    for(const ch of text){
      const w=c.measureText(ch).width;
      const advance=((w+tracking)/textRadius)*arcScale;
      const a=angle+advance/2;
      c.save();
      c.translate(cx+Math.cos(a)*textRadius,cy+Math.sin(a)*textRadius);
      c.rotate(a+Math.PI/2);
      c.fillText(ch,0,0);
      c.restore();
      angle+=advance;
    }
    c.restore();
  }

  function drawCenterLockHub(c,S,cx,cy){
    // Smaller realistic jewel-case spindle so it masks less artwork.
    const outerR=S*.0350;
    const discHoleR=S*.0210;
    const coreR=S*.0105;
    const petalOuter=S*.0220;
    const petalInner=S*.0120;
    const teeth=12;
    const halfGap=.040;
    const halfPetal=.094;

    c.save();

    // Molded hub seat.
    const seat=c.createRadialGradient(cx-S*.008,cy-S*.009,S*.003,cx,cy,outerR);
    seat.addColorStop(0,'rgba(112,118,126,.54)');
    seat.addColorStop(.30,'rgba(49,53,60,.68)');
    seat.addColorStop(.68,'rgba(14,16,20,.95)');
    seat.addColorStop(1,'rgba(2,3,5,1)');
    c.fillStyle=seat;
    circlePath(c,cx,cy,outerR);
    c.fill();

    // Outer molded lip.
    c.lineWidth=Math.max(1,S*.00120);
    c.strokeStyle='rgba(244,248,252,.32)';
    circlePath(c,cx,cy,outerR);
    c.stroke();

    c.lineWidth=Math.max(.7,S*.00068);
    c.strokeStyle='rgba(255,255,255,.14)';
    circlePath(c,cx,cy,discHoleR*1.06);
    c.stroke();

    // Dark recess for the CD hole.
    const recess=c.createRadialGradient(cx-S*.0045,cy-S*.0055,S*.002,cx,cy,discHoleR);
    recess.addColorStop(0,'rgba(10,11,14,.98)');
    recess.addColorStop(.72,'rgba(3,4,6,1)');
    recess.addColorStop(1,'rgba(0,0,1,1)');
    c.fillStyle=recess;
    circlePath(c,cx,cy,discHoleR);
    c.fill();

    // Twelve flexible retaining petals.
    for(let i=0;i<teeth;i++){
      const a=-Math.PI/2+i*(Math.PI*2/teeth);
      const a1=a-halfPetal;
      const a2=a+halfPetal;
      const b1=a-halfGap;
      const b2=a+halfGap;

      c.beginPath();
      c.moveTo(cx+Math.cos(a1)*petalOuter,cy+Math.sin(a1)*petalOuter);
      c.lineTo(cx+Math.cos(b1)*petalInner,cy+Math.sin(b1)*petalInner);
      c.quadraticCurveTo(
        cx+Math.cos(a)*coreR*.96,
        cy+Math.sin(a)*coreR*.96,
        cx+Math.cos(b2)*petalInner,
        cy+Math.sin(b2)*petalInner
      );
      c.lineTo(cx+Math.cos(a2)*petalOuter,cy+Math.sin(a2)*petalOuter);
      c.quadraticCurveTo(
        cx+Math.cos(a)*petalOuter*1.035,
        cy+Math.sin(a)*petalOuter*1.035,
        cx+Math.cos(a1)*petalOuter,
        cy+Math.sin(a1)*petalOuter
      );
      c.closePath();

      const gx=cx+Math.cos(a-Math.PI*.18)*petalOuter*.35;
      const gy=cy+Math.sin(a-Math.PI*.18)*petalOuter*.35;
      const g=c.createRadialGradient(gx,gy,S*.0010,cx,cy,petalOuter*.95);
      if(i%2===0){
        g.addColorStop(0,'rgba(225,230,236,.82)');
        g.addColorStop(.40,'rgba(117,124,133,.68)');
      }else{
        g.addColorStop(0,'rgba(176,183,192,.64)');
        g.addColorStop(.40,'rgba(83,89,98,.68)');
      }
      g.addColorStop(.80,'rgba(28,31,37,.96)');
      g.addColorStop(1,'rgba(6,7,10,1)');
      c.fillStyle=g;
      c.fill();

      c.lineWidth=Math.max(.58,S*.00046);
      c.strokeStyle='rgba(245,248,252,.28)';
      c.stroke();

      // Radial slot between neighboring petals.
      c.beginPath();
      c.moveTo(
        cx+Math.cos(a+halfPetal+.016)*petalInner*.96,
        cy+Math.sin(a+halfPetal+.018)*petalInner*.96
      );
      c.lineTo(
        cx+Math.cos(a+halfPetal+.018)*petalOuter*.98,
        cy+Math.sin(a+halfPetal+.018)*petalOuter*.98
      );
      c.lineWidth=Math.max(.8,S*.00078);
      c.strokeStyle='rgba(0,0,0,.88)';
      c.stroke();
    }

    // Central push-release core.
    const core=c.createRadialGradient(cx-S*.005,cy-S*.005,S*.0018,cx,cy,coreR);
    core.addColorStop(0,'rgba(63,68,77,.94)');
    core.addColorStop(.42,'rgba(25,28,34,.98)');
    core.addColorStop(1,'rgba(2,3,5,1)');
    c.fillStyle=core;
    circlePath(c,cx,cy,coreR);
    c.fill();

    c.lineWidth=Math.max(.8,S*.00088);
    c.strokeStyle='rgba(248,250,252,.22)';
    circlePath(c,cx,cy,coreR);
    c.stroke();

    // Smaller center depression.
    c.fillStyle='rgba(0,0,1,.90)';
    circlePath(c,cx,cy,S*.0068);
    c.fill();
    c.lineWidth=Math.max(.6,S*.00055);
    c.strokeStyle='rgba(255,255,255,.10)';
    circlePath(c,cx,cy,S*.0085);
    c.stroke();

    // Specular highlights on the molded plastic.
    c.beginPath();
    c.arc(cx,cy,outerR*.93,Math.PI*1.04,Math.PI*1.72);
    c.lineWidth=Math.max(.9,S*.0010);
    c.strokeStyle='rgba(255,255,255,.25)';
    c.stroke();

    c.beginPath();
    c.arc(cx,cy,discHoleR*.96,Math.PI*.08,Math.PI*.62);
    c.lineWidth=Math.max(.7,S*.00065);
    c.strokeStyle='rgba(255,255,255,.12)';
    c.stroke();

    c.restore();
  }

  function drawOuterRingText(c,S,cx,cy,r){
    const text='MADE IN ENGLAND - OPTIMEDIA SOLUTIONS - POLYCARBONATE';
    const textRadius=S*.3975;

    c.save();
    c.fillStyle='rgba(242,242,238,.86)';
    c.textAlign='center';
    c.textBaseline='middle';

    let fontPx=S*.0104;
    const minFont=S*.0089;
    const tracking=S*.00028;
    const maxArc=1.34;
    const arcCenter=2.30;

    function setFont(){
      c.font=`500 ${fontPx}px Arial, Helvetica, sans-serif`;
    }
    function measureArc(){
      let total=0;
      for(const ch of text) total+=c.measureText(ch).width+tracking;
      return Math.max(0,total-tracking)/textRadius;
    }

    setFont();
    let arc=measureArc();
    while(arc>maxArc && fontPx>minFont){
      fontPx*=.985;
      setFont();
      arc=measureArc();
    }

    const arcScale=arc>maxArc ? maxArc/arc : 1;
    const usedArc=arc*arcScale;
    let angle=arcCenter+usedArc/2;

    for(const ch of text){
      const w=c.measureText(ch).width;
      const advance=((w+tracking)/textRadius)*arcScale;
      const a=angle-advance/2;
      c.save();
      c.translate(cx+Math.cos(a)*textRadius,cy+Math.sin(a)*textRadius);
      c.rotate(a-Math.PI/2);
      c.fillText(ch,0,0);
      c.restore();
      angle-=advance;
    }
    c.restore();
  }

  function drawCoverImage(c, S, cx, cy, radius){
    c.save(); circlePath(c,cx,cy,radius); c.clip();
    if(state.image){
      const im=state.image, cover=radius*2;
      const base=Math.max(cover/im.width,cover/im.height)*state.zoom;
      const w=im.width*base,h=im.height*base;
      c.translate(cx + state.x*S, cy + state.y*S);
      c.rotate(state.rotation*Math.PI/180);
      c.filter=`brightness(${state.brightness}%) contrast(${state.contrast}%) saturate(${state.saturation}%)`;
      if(state.motion>0){
        const steps=Math.min(10,2+Math.ceil(state.motion/2));
        const inheritedAlpha=c.globalAlpha;
        c.globalAlpha=inheritedAlpha/Math.max(1,steps*.64);
        for(let i=0;i<steps;i++){
          c.save();
          const t=(i/(steps-1||1)-.5)*(state.motion*.0048);
          c.rotate(t);
          c.drawImage(im,-w/2,-h/2,w,h);
          c.restore();
        }
        c.globalAlpha=inheritedAlpha;
      } else c.drawImage(im,-w/2,-h/2,w,h);
      c.filter='none';
    } else {
      const g=c.createRadialGradient(cx-radius*.3,cy-radius*.3,radius*.1,cx,cy,radius);
      g.addColorStop(0,'#303041');g.addColorStop(.5,'#14141b');g.addColorStop(1,'#08080b');
      c.fillStyle=g;c.fillRect(cx-radius,cy-radius,radius*2,radius*2);
      c.save();c.translate(cx,cy);c.rotate(-.22);
      c.fillStyle='rgba(124,92,255,.28)';c.fillRect(-radius*.12,-radius*1.3,radius*.24,radius*2.6);
      c.rotate(.68);c.fillStyle='rgba(185,255,74,.1)';c.fillRect(-radius*.06,-radius*1.2,radius*.12,radius*2.4);c.restore();
      c.fillStyle='rgba(255,255,255,.65)';c.textAlign='center';c.font=`700 ${S*.024}px system-ui`;c.fillText('DROP A PHOTO',cx,cy-radius*.06);
      c.fillStyle='rgba(255,255,255,.35)';c.font=`500 ${S*.014}px system-ui`;c.fillText('to build your jewel case',cx,cy+radius*.02);
    }
    c.restore();
  }

  function drawTemplateBase(c,S){
    c.fillStyle='#020203';c.fillRect(0,0,S,S);
    if(templateImage.complete && templateImage.naturalWidth){
      c.save();
      c.imageSmoothingEnabled=true;
      c.imageSmoothingQuality='high';
      c.drawImage(templateImage,0,0,S,S);
      c.restore();
    } else {
      const bg=c.createRadialGradient(S*.5,S*.49,S*.12,S*.5,S*.49,S*.72);
      bg.addColorStop(0,'#303035');bg.addColorStop(.55,'#111114');bg.addColorStop(1,'#020203');
      c.fillStyle=bg;c.fillRect(0,0,S,S);
    }
  }

  function drawDisc(c,S){
    // Geometry is calibrated to the supplied jewel-case reference, centered on its photographed hub.
    const cx=S*.5030,cy=S*.4980,r=S*.3890,hubR=S*.0900,hubProtectR=S*.1120;

    if(state.image){
      c.save();
      c.beginPath();
      c.arc(cx,cy,r,0,Math.PI*2);
      c.arc(cx,cy,hubProtectR,0,Math.PI*2,true);
      c.clip('evenodd');

      // Overlay blending lets the real photographed disc keep its physical
      // highlights, shadows, scratches and translucent plastic while the
      // uploaded artwork appears printed into the disc surface.
      c.globalCompositeOperation='source-over';
      c.globalAlpha=.94;
      drawCoverImage(c,S,cx,cy,r*1.012);
      c.restore();
    }

    // Disc finish is intentionally visible at normal slider values. The finish
    // stays inside the printable disc area and never covers the photographed hub.
    const rgb=discColors[state.discStyle]||discColors.clear;
    const strength=Math.max(0,Math.min(1,state.discOpacity/75));
    c.save();
    c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.arc(cx,cy,hubProtectR,0,Math.PI*2,true);c.clip('evenodd');

    if(state.discStyle==='clear'){
      // Clear keeps the artwork neutral but adds a controllable glassy cool sheen.
      if(strength>0){
        const clearSheen=c.createRadialGradient(cx-r*.28,cy-r*.34,r*.06,cx,cy,r);
        clearSheen.addColorStop(0,`rgba(238,248,255,${.10*strength})`);
        clearSheen.addColorStop(.48,`rgba(155,190,215,${.055*strength})`);
        clearSheen.addColorStop(1,'rgba(120,145,165,0)');
        c.globalCompositeOperation='screen';
        c.fillStyle=clearSheen;c.fillRect(cx-r,cy-r,r*2,r*2);
      }
    } else if(state.discStyle==='black'){
      c.globalCompositeOperation='multiply';
      c.fillStyle=`rgba(4,4,7,${.18+.62*strength})`;
      c.fillRect(cx-r,cy-r,r*2,r*2);
    } else if(state.discStyle==='smoke'){
      c.globalCompositeOperation='multiply';
      c.fillStyle=`rgba(24,27,34,${.12+.46*strength})`;
      c.fillRect(cx-r,cy-r,r*2,r*2);
      c.globalCompositeOperation='screen';
      const smokeGlow=c.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
      smokeGlow.addColorStop(0,`rgba(135,145,160,${.06+.08*strength})`);
      smokeGlow.addColorStop(1,'rgba(255,255,255,0)');
      c.fillStyle=smokeGlow;c.fillRect(cx-r,cy-r,r*2,r*2);
    } else if(state.discStyle==='iridescent'){
      c.globalCompositeOperation='soft-light';
      const rainbow=c.createLinearGradient(cx-r*.9,cy-r,cx+r*.9,cy+r);
      rainbow.addColorStop(0,`rgba(255,74,157,${.18+.30*strength})`);
      rainbow.addColorStop(.30,`rgba(87,124,255,${.16+.28*strength})`);
      rainbow.addColorStop(.62,`rgba(73,255,207,${.15+.27*strength})`);
      rainbow.addColorStop(1,`rgba(255,219,88,${.17+.28*strength})`);
      c.fillStyle=rainbow;c.fillRect(cx-r,cy-r,r*2,r*2);
      // Keep iridescence as a uniform reflective film. Real specular
      // highlights come from the photographed jewel-case template below.
    } else {
      // Purple and pink get a saturated translucent lacquer rather than a
      // barely-visible soft-light wash.
      c.globalCompositeOperation='soft-light';
      c.fillStyle=`rgba(${rgb[0]},${rgb[1]},${rgb[2]},${.26+.50*strength})`;
      c.fillRect(cx-r,cy-r,r*2,r*2);
      // Keep the lacquer uniform. Real specular highlights come from
      // the photographed jewel-case template below, avoiding fake oval bands.
    }
    c.restore();

    // Optical construction layers: a real CD reads as several concentric
    // materials rather than one flat tinted circle. These layers are subtle,
    // circular and scale with the export size, so they stay realistic without
    // introducing synthetic oval highlights.
    c.save();
    c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.arc(cx,cy,hubProtectR,0,Math.PI*2,true);c.clip('evenodd');

    // Dark molded edge / thickness at the outer circumference.
    c.globalCompositeOperation='multiply';
    const edgeShade=c.createRadialGradient(cx,cy,r*.86,cx,cy,r);
    edgeShade.addColorStop(0,'rgba(0,0,0,0)');
    edgeShade.addColorStop(.78,'rgba(0,0,0,.018)');
    edgeShade.addColorStop(.94,'rgba(0,0,0,.14)');
    edgeShade.addColorStop(1,'rgba(0,0,0,.34)');
    c.fillStyle=edgeShade;c.fillRect(cx-r,cy-r,r*2,r*2);

    // Thin silver reflective data band just inside the printable edge.
    c.globalCompositeOperation='screen';
    c.lineWidth=Math.max(1,S*.00115);
    c.strokeStyle='rgba(222,232,238,.22)';
    circlePath(c,cx,cy,r*.982);c.stroke();
    c.lineWidth=Math.max(.7,S*.00062);
    c.strokeStyle='rgba(255,255,255,.19)';
    circlePath(c,cx,cy,r*.968);c.stroke();

    // Real CDs have a faint radial metallic / polycarbonate falloff.
    const optical=c.createRadialGradient(cx,cy,hubProtectR*1.02,cx,cy,r);
    optical.addColorStop(0,'rgba(210,220,226,.055)');
    optical.addColorStop(.18,'rgba(255,255,255,.018)');
    optical.addColorStop(.72,'rgba(154,178,193,.025)');
    optical.addColorStop(.93,'rgba(232,242,248,.06)');
    optical.addColorStop(1,'rgba(255,255,255,.11)');
    c.globalCompositeOperation='screen';
    c.fillStyle=optical;c.fillRect(cx-r,cy-r,r*2,r*2);

    // Inner clear polycarbonate ring around the molded spindle.
    c.lineWidth=Math.max(1.2,S*.00135);
    c.strokeStyle='rgba(220,230,236,.16)';
    circlePath(c,cx,cy,hubProtectR*1.055);c.stroke();
    c.lineWidth=Math.max(.7,S*.00058);
    c.strokeStyle='rgba(255,255,255,.10)';
    circlePath(c,cx,cy,hubProtectR*1.105);c.stroke();

    // Extremely subtle circular light rolloff: only radial gradients, never
    // ellipses, so the surface gains depth without a fake highlight artifact.
    const lightRoll=c.createRadialGradient(cx-r*.22,cy-r*.18,r*.07,cx,cy,r*.96);
    lightRoll.addColorStop(0,'rgba(255,255,255,.055)');
    lightRoll.addColorStop(.42,'rgba(255,255,255,.018)');
    lightRoll.addColorStop(1,'rgba(255,255,255,0)');
    c.globalCompositeOperation='screen';
    c.fillStyle=lightRoll;c.fillRect(cx-r,cy-r,r*2,r*2);
    c.restore();

    if(state.grooves){
      c.save();
      c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.arc(cx,cy,hubProtectR,0,Math.PI*2,true);c.clip('evenodd');
      c.lineWidth=Math.max(.45,S*.00030);
      // Dense, faint concentric tracks read more like a pressed optical disc
      // than widely-spaced decorative rings.
      let track=0;
      for(let rr=hubR*1.18;rr<r*.974;rr+=S*.0046){
        const a=.0065+(track%7)*.00115;
        c.strokeStyle=`rgba(235,245,250,${a})`;
        circlePath(c,cx,cy,rr);c.stroke();
        track++;
      }
      c.restore();
    }

    // Re-project the supplied photograph as the final specular/plastic layer.
    // Screen mode makes the black background disappear while retaining the
    // real case rails, disc reflections, dust and acrylic highlights.
    if(templateImage.complete && templateImage.naturalWidth){
      c.save();
      c.globalCompositeOperation='screen';
      // Keep photographed plastic/specular detail present but restrained so
      // artwork remains printed-looking instead of washed out.
      c.globalAlpha=.14+(state.glare/100)*.30;
      c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
      c.drawImage(templateImage,0,0,S,S);
      c.restore();
    }

    // Restore the entire photographed center assembly at full opacity.
    // The larger circular mask prevents uploaded artwork from bleeding between
    // the molded spokes/patent ring and creating a broken-looking center cutout.
    if(templateImage.complete && templateImage.naturalWidth){
      c.save();
      c.beginPath();
      c.arc(cx,cy,hubProtectR,0,Math.PI*2);
      c.clip();
      c.globalCompositeOperation='source-over';
      c.globalAlpha=1;
      c.imageSmoothingEnabled=true;
      c.imageSmoothingQuality='high';
      c.drawImage(templateImage,0,0,S,S);
      c.restore();
    }
  }

  function seeded(seed){
    let x=Math.sin(seed*999.91)*43758.5453;return x-Math.floor(x);
  }

  function drawCase(c,S){
    if(state.caseStyle==='template')return;

    // Case treatments are clipped OUTSIDE the disc, so changing the Case
    // selector visibly changes the jewel-case plastic without recoloring the CD.
    const cx=S*.5030,cy=S*.4980,discR=S*.4050;
    c.save();
    c.beginPath();
    c.rect(0,0,S,S);
    c.arc(cx,cy,discR,0,Math.PI*2,true);
    c.clip('evenodd');

    if(state.caseStyle==='clean'){
      // Cleaner plastic: brighter acrylic, lower apparent grime, crisper rails.
      if(templateImage.complete && templateImage.naturalWidth){
        c.save();
        c.filter='brightness(1.14) contrast(.90) saturate(.82)';
        c.globalCompositeOperation='screen';
        c.globalAlpha=.34;
        c.drawImage(templateImage,0,0,S,S);
        c.restore();
      }
      c.globalCompositeOperation='screen';
      const polish=c.createLinearGradient(0,0,S,S);
      polish.addColorStop(0,'rgba(255,255,255,.10)');
      polish.addColorStop(.48,'rgba(210,225,235,.025)');
      polish.addColorStop(1,'rgba(255,255,255,.075)');
      c.fillStyle=polish;c.fillRect(0,0,S,S);
    } else if(state.caseStyle==='worn'){
      // Worn plastic: darker/yellower acrylic plus edge grime and scratches.
      c.globalCompositeOperation='multiply';
      c.fillStyle='rgba(71,62,48,.25)';
      c.fillRect(0,0,S,S);
      c.globalCompositeOperation='soft-light';
      c.fillStyle='rgba(105,78,48,.20)';
      c.fillRect(0,0,S,S);

      if(state.scratches){
        c.globalCompositeOperation='screen';
        c.lineCap='round';
        const amount=Math.round(34+state.grain*.65);
        for(let i=0;i<amount;i++){
          const x=seeded(i+2)*S,y=seeded(i+55)*S,len=(.018+seeded(i+9)*.15)*S,ang=(-1.05+seeded(i+91)*2.1);
          c.strokeStyle=`rgba(255,255,255,${.035+seeded(i+7)*.11})`;
          c.lineWidth=Math.max(.65,S*(.00045+seeded(i+13)*.00075));
          c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(ang)*len,y+Math.sin(ang)*len);c.stroke();
        }
      }

      c.globalCompositeOperation='multiply';
      const edge=c.createRadialGradient(S*.5,S*.49,S*.34,S*.5,S*.49,S*.72);
      edge.addColorStop(0,'rgba(0,0,0,0)');
      edge.addColorStop(.72,'rgba(45,30,18,.05)');
      edge.addColorStop(1,'rgba(32,20,11,.24)');
      c.fillStyle=edge;c.fillRect(0,0,S,S);
    }
    c.restore();
  }

  function drawNoise(c,S){
    if(state.grain<=0)return;
    const count=Math.round((state.grain/100)*900);
    c.save();
    for(let i=0;i<count;i++){
      const x=seeded(i+160)*S,y=seeded(i+811)*S,r=seeded(i+37)*S*.0018;
      c.fillStyle=`rgba(255,255,255,${.02+seeded(i+111)*.08})`;circlePath(c,x,y,r);c.fill();
    }
    c.restore();
  }

  function drawBarcode(c,S){
    const x=S*.075,y=S*.835,w=S*.205,h=S*.095;
    c.fillStyle='rgba(245,245,242,.95)';roundedRectPath(c,x,y,w,h,S*.004);c.fill();
    let cursor=x+w*.12;
    for(let i=0;i<34;i++){
      const bw=(1+Math.floor(seeded(i+300)*3))*S*.0017;
      c.fillStyle='#111';c.fillRect(cursor,y+h*.13,bw,h*.58);cursor+=bw+S*.0017;
      if(cursor>x+w*.9)break;
    }
    c.fillStyle='#222';c.font=`500 ${S*.009}px ui-monospace,monospace`;c.fillText('3  25270  73250  6',x+w*.12,y+h*.86);
  }

  function drawAdvisory(c,S){
    const x=S*.075,y=S*.77,w=S*.19,h=S*.11;
    c.fillStyle='rgba(245,245,242,.96)';c.fillRect(x,y,w,h);c.strokeStyle='#111';c.lineWidth=S*.004;c.strokeRect(x,y,w,h);

    c.fillStyle='#111';c.font=`800 ${S*.012}px Arial,sans-serif`;c.fillText('EXPLICIT CONTENT',x+w/2,y+h*.84);

  function drawPrice(c,S){

  function drawTitleSticker(c,S){
    const title=(state.albumTitle||'UNTITLED').toUpperCase(), artist=(state.artistName||'JEWELCASE').toUpperCase();
    const x=S*.49,y=S*.865,w=S*.39,h=S*.075;

  function render(target=canvas,size=900){
    target.width=size;target.height=size;
    const c=target.getContext('2d'),S=size;
    c.clearRect(0,0,S,S);
    drawTemplateBase(c,S);
    drawDisc(c,S);
    drawCase(c,S);
    drawNoise(c,S);
    if(state.titleSticker)drawTitleSticker(c,S);
    if(state.priceSticker)drawPrice(c,S);
    if(state.advisory)drawAdvisory(c,S);
    if(state.barcode)drawBarcode(c,S);

    // Physical rails, hinge and inner lip are preserved from the supplied template.
  }

  let raf=0;
  function requestRender(){
    if(raf)return;
    raf=requestAnimationFrame(()=>{raf=0;render(canvas,900);});
  }

  function loadFile(file){
    if(!file || !file.type.startsWith('image/'))return;
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{state.image=img;state.x=0;state.y=0;requestRender();toast('Photo loaded');};
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  }

  $('fileInput').addEventListener('change',e=>loadFile(e.target.files[0]));
  const dz=$('dropZone');
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over')}));
  dz.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));

  let dragging=false,lastX=0,lastY=0;
  canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging')});
  canvas.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const rect=canvas.getBoundingClientRect();
    state.x+=(e.clientX-lastX)/rect.width;state.y+=(e.clientY-lastY)/rect.height;
    lastX=e.clientX;lastY=e.clientY;requestRender();
  });
  canvas.addEventListener('pointerup',()=>{dragging=false;canvas.classList.remove('dragging')});
  canvas.addEventListener('pointercancel',()=>{dragging=false;canvas.classList.remove('dragging')});
  canvas.addEventListener('wheel',e=>{
    e.preventDefault();state.zoom=Math.max(.6,Math.min(2.8,state.zoom*(e.deltaY<0?1.05:.95)));
    $('zoom').value=state.zoom;syncState();requestRender();
  },{passive:false});
  canvas.addEventListener('dblclick',()=>{state.x=0;state.y=0;requestRender()});

  const presets={
    night:{discStyle:'purple',caseStyle:'template',discOpacity:22,glare:56,grain:16,motion:6,brightness:90,contrast:118,saturation:106},
    clear:{discStyle:'clear',caseStyle:'clean',discOpacity:4,glare:58,grain:6,motion:0,brightness:102,contrast:104,saturation:100},
    smoke:{discStyle:'smoke',caseStyle:'worn',discOpacity:30,glare:38,grain:38,motion:3,brightness:82,contrast:128,saturation:84},
    bubblegum:{discStyle:'pink',caseStyle:'template',discOpacity:20,glare:64,grain:12,motion:2,brightness:104,contrast:110,saturation:116}
  };
  document.querySelectorAll('[data-preset]').forEach(btn=>btn.addEventListener('click',()=>{
    const p=presets[btn.dataset.preset];Object.assign(state,p);
    Object.keys(p).forEach(k=>{if($(k))$(k).value=p[k]});
    syncState();requestRender();toast(btn.firstChild.textContent.trim()+' preset');
  }));

  function reset(){
    Object.assign(state,{zoom:1.05,rotation:0,brightness:100,contrast:108,saturation:100,motion:2,discStyle:'clear',caseStyle:'template',discOpacity:10,glare:48,grain:12,grooves:true,scratches:true,titleSticker:false,advisory:false,priceSticker:false,barcode:false,albumTitle:'',artistName:'',x:0,y:0});
    controls.forEach(id=>{const el=$(id); if(el.type==='checkbox')el.checked=state[id];else el.value=state[id]});
    syncState();requestRender();toast('Controls reset');
  }
  $('resetBtn').addEventListener('click',reset);

  function safeName(){
    const raw=(state.albumTitle||'jewelcase').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    return raw||'jewelcase';
  }
  function exportArtwork(){
    const size=Number($('exportSize').value),type=$('exportType').value;
    const out=document.createElement('canvas');render(out,size);
    const mime=type==='jpeg'?'image/jpeg':'image/png';
    out.toBlob(blob=>{
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${safeName()}-${size}.${type==='jpeg'?'jpg':'png'}`;
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast(`Exported ${size}×${size}`);
    },mime,type==='jpeg'?.94:undefined);
  }
  $('exportBtn').addEventListener('click',exportArtwork);
  $('quickExportBtn').addEventListener('click',()=>{$('exportType').value='png';exportArtwork()});

  function toast(msg){
    const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1700);
  }

  syncState();requestRender();
})();
</script>
</body>
</html>
