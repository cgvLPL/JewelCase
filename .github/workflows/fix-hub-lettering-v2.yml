name: Apply audited hub lettering fix

on:
  push:
    paths:
      - ".github/workflows/fix-hub-lettering-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch hub lettering
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
      - name: Verify patch
        run: |
          grep -Fq "const cleanOuter=S*.1330;" index.html
          grep -Fq "const textRadius=S*.1020;" index.html
          grep -Fq "const maxArc=Math.PI*.94;" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Audit and fix center hub lettering"
          git push
