name: Make JewelCase logo transparent

on:
  push:
    paths:
      - ".github/workflows/transparent-logo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transparent-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove white background
        run: |
          python3 -m pip install --quiet pillow numpy
          echo '' | base64 -d > /tmp/transparent_logo.py
          python3 /tmp/transparent_logo.py

      - name: Update app and README
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ["index.html","README.md"]:
              p=Path(name)
              s=p.read_text()
              s=s.replace("assets/jewelcase-logo.webp","assets/jewelcase-logo-transparent.png")
              p.write_text(s)
          PY

      - name: Verify transparent PNG
        run: |
          python3 - <<'PY'
          from PIL import Image
          im=Image.open("assets/jewelcase-logo-transparent.png")
          assert im.mode=="RGBA", im.mode
          lo,hi=im.getchannel("A").getextrema()
          assert lo==0 and hi==255, (lo,hi)
          print("logo",im.size,"alpha",(lo,hi))
          PY
          grep -Fq "assets/jewelcase-logo-transparent.png" index.html
          grep -Fq "assets/jewelcase-logo-transparent.png" README.md

      - name: Commit transparent logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jewelcase-logo-transparent.png index.html README.md
          git rm -f assets/jewelcase-logo.webp
          git commit -m "Use transparent JewelCase logo"
          git push
