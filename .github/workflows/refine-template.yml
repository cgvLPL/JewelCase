name: Apply high-res jewel-case template

on:
  push:
    paths:
      - ".github/workflows/refine-template.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-template:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild 2048px template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets

          test -f .template-payload/00
          cat .template-payload/0* > /tmp/jewelcase-template.b64
          base64 -d /tmp/jewelcase-template.b64 > assets/jewel-case-template.avif

          bytes="$(wc -c < assets/jewel-case-template.avif)"
          echo "Template bytes: $bytes"
          if [ "$bytes" -lt 70000 ]; then
            echo "Decoded template is unexpectedly small." >&2
            exit 1
          fi

          file assets/jewel-case-template.avif

      - name: Calibrate renderer to new template
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text()

          old_source = "templateImage.src = 'assets/jewel-case-template.png';"
          new_source = "templateImage.src = 'assets/jewel-case-template.avif';"
          if old_source in s:
              s = s.replace(old_source, new_source, 1)
          elif new_source not in s:
              raise SystemExit("Could not find template image source")

          candidates = [
              "const cx=S*.5000,cy=S*.4960,r=S*.4125,hubR=S*.1415;",
              "const cx=S*.5000,cy=S*.5020,r=S*.4090,hubR=S*.1465;",
              "const cx=S*.500,cy=S*.495,r=S*.409,hubR=S*.145;"
          ]
          target = "const cx=S*.5000,cy=S*.5020,r=S*.4090,hubR=S*.1465;"
          for old in candidates:
              if old in s:
                  s = s.replace(old, target, 1)
                  break
          if target not in s:
              raise SystemExit("Could not find disc geometry block")

          if "drawCoverImage(c,S,cx,cy,r*1.015);" not in s:
              if "drawCoverImage(c,S,cx,cy,r);" in s:
                  s = s.replace(
                      "drawCoverImage(c,S,cx,cy,r);",
                      "drawCoverImage(c,S,cx,cy,r*1.015);",
                      1
                  )
              else:
                  raise SystemExit("Could not find artwork projection block")

          p.write_text(s)
          PY

      - name: Commit template update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -f assets/jewel-case-template.png || true
          git rm -rf .template-payload || true
          git rm -rf .template-parts || true
          git add assets/jewel-case-template.avif index.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Use supplied 2048px jewel-case template"
          git push
